# ayarlar.toml olarak kopyalayın. Yazmadığınız her ayar varsayılan değerinde kalır.

veritabani = "veri/ajan.db"
rapor_klasoru = "raporlar"

[baslangic_nakit]
bist = 100000.0 # TRY, sanal
abd = 5000.0    # USD, sanal

[evren]
bist = ["THYAO", "ASELS", "BIMAS", "KCHOL", "TUPRS", "SISE", "FROTO", "EREGL"]
abd = ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN", "JPM", "KO", "XOM"]

[risk]
max_pozisyon_orani = 0.10   # tek hisse en fazla varlığın %10'u
max_hisse_orani = 0.80      # en az %20 nakit
gunluk_zarar_limiti = 0.02  # gün içi %2 kayıpta yeni alım yok
max_dusus_limiti = 0.15     # zirveden %15 düşüşte hesap durur
zarar_kes_orani = 0.07
min_islem_tutari = 100.0
max_gunluk_islem = 10
min_tez_olasiligi = 0.55

[ajan]
model = "claude-opus-5-5"
efor = "high"       # low | medium | high | xhigh | max
max_tur = 12
web_arama = true
