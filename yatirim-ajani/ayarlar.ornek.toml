# ayarlar.toml olarak kopyalayın. Yazmadığınız her ayar varsayılan değerinde kalır.

veritabani = "veri/ajan.db"
rapor_klasoru = "raporlar"
veri_klasoru = "veri/saatlik"  # saatlik çubuklar, gün etiketleri, eğitilmiş modeller
test_orani = 0.20              # rastgele GÜN etiketli test payı
tohum = 2024

[baslangic_nakit]
bist = 1000000.0 # TRY, sanal
abd = 5000.0    # USD, sanal

# Sağlam çekirdek: güven işareti, zorunlu ağırlık değil. Asıl ölçüt yönetim kalitesi.
saglam_cekirdek = ["ASELS", "TUPRS", "AHGAZ", "THYAO", "KCHOL", "SAHOL", "BIMAS", "EREGL"]
tez_notu = """Türkiye'de köklü, devletle ilişkisi sağlam ve yönetimi güçlü şirketler uzun vadede büyür;
bazılarında büyüme durmuş olabilir ve fiyat gel-git yapar. Asıl ölçüt büyüklük değil, yönetim kalitesidir:
AHGAZ büyük değildir ama başında Ahlatcı vardır. Paranın tamamının çekirdekte olması gerekmez."""

[evren]
# Taranan geniş evren (BIST 50 kesiti). İstediğiniz gibi değiştirin.
bist = [
  "ASELS", "TUPRS", "AHGAZ", "THYAO", "KCHOL", "SAHOL", "BIMAS", "EREGL", "SISE", "TCELL",
  "TTKOM", "HALKB", "VAKBN", "ISCTR", "FROTO", "TOASO", "PGSUS", "ENKAI", "KOZAL", "AKBNK",
  "YKBNK", "GARAN", "ARCLK", "PETKM", "TAVHL", "MGROS", "SASA", "HEKTS", "OYAKC", "GUBRF",
  "ASTOR", "KONTR", "CIMSA", "AKSEN", "ODAS", "TKFEN", "ULKER", "DOAS", "BRSAN", "KRDMD",
]
abd = ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN", "JPM", "KO", "XOM"]

[risk]
max_pozisyon_orani = 0.10   # tek hisse en fazla varlığın %10'u
max_hisse_orani = 0.80      # en az %20 nakit
gunluk_zarar_limiti = 0.02  # gün içi %2 kayıpta yeni alım yok
max_dusus_limiti = 0.15     # zirveden %15 düşüşte hesap durur
zarar_kes_orani = 0.07
min_islem_tutari = 100.0
max_gunluk_islem = 10
min_tez_olasiligi = 0.55
min_net_getiri = 0.005      # saatlik kapı: masraf sonrası beklenen getiri < %0,5 ise işlem yok (%1'e çıkarılabilir)

[ajan]
model = "claude-opus-5-5"   # tek ajanlı `arastir` komutu
efor = "high"               # low | medium | high | xhigh | max
max_tur = 12
web_arama = true
# `ekip` komutu: baş planlar ve dağıtır; analist tez yazar; mühendis test sonuçlarını yorumlar; stajyer veri toplar
bas = "claude-fable-5-1"
analist = "claude-opus-5-5"
muhendis = "claude-sonnet-5-5"
stajyer = "claude-haiku-5-5"
arastirma_gun_araligi = 7   # bütçe: haftada bir oturum
max_gorev = 8               # oturum başına alt görev üst sınırı
