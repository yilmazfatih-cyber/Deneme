name: Yatırım ajanı

# Dil modeli kullanmaz; yalnız veri, eğitim ve saatlik tarama. Çıktılar `ajan-ciktilari` dalına yazılır,
# kod dallarına dokunulmaz. Haftalık araştırma Claude Code zamanlanmış göreviyle yapılır (yatirim-ajani/EKIP.md).
# Saatler UTC; BIST seansı 10:00–18:00 TRT = 07:00–15:00 UTC.

on:
  workflow_dispatch:
    inputs:
      is:
        description: 'veri-egitim | tara | dosya-veri | ag-veri'
        default: veri-egitim
        required: true
      hisseler:
        description: 'dosya-veri için virgülle ayrılmış hisse listesi (boş = evren)'
        default: ''
        required: false
      baslangic:
        description: 'dosya-veri başlangıç günü'
        default: '2024-01-01'
        required: false
      kaynak:
        description: 'ag-veri için kaynak listesi (boş = hepsi): tv,yahoo,isy,mali,seri,saatlik,hisse_saatlik,isy_ek,kap_liste,kap_detay'
        default: ''
        required: false
  schedule:
    - cron: '45 16 * * 1-5' # 19:45 TRT hafta içi: veri çek + eğit
    - cron: '20 7-14 * * 1-5' # 10:20–17:20 TRT saat başı +20 dk: saatlik tarama (Yahoo ~15 dk gecikmeli)

permissions:
  contents: write

concurrency:
  group: yatirim-ajani
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -e "yatirim-ajani[yahoo]"

      - name: Hangi iş?
        id: is
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ad=${{ inputs.is }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 16 * * 1-5" ]; then
            echo "ad=veri-egitim" >> "$GITHUB_OUTPUT"
          else
            echo "ad=tara" >> "$GITHUB_OUTPUT"
          fi

      - name: Çıktı dalını al
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git fetch origin ajan-ciktilari:ajan-ciktilari 2>/dev/null; then
            bos=$(git commit-tree -m "ajan çıktıları" "$(git hash-object -t tree /dev/null)") || exit 1
            git branch ajan-ciktilari "$bos"
          fi
          git worktree add cikti ajan-ciktilari
          mkdir -p cikti/veri cikti/raporlar
          cp -r cikti/veri yatirim-ajani/ 2>/dev/null || true
          cp -r cikti/raporlar yatirim-ajani/ 2>/dev/null || true

      - name: Veri çek ve eğit
        if: steps.is.outputs.ad == 'veri-egitim'
        working-directory: yatirim-ajani
        run: |
          python -m yatirim_ajani veri-cek --piyasa bist
          mkdir -p raporlar
          python -m yatirim_ajani egit --piyasa bist --kayma-kiyasla | tee "raporlar/egitim-bist-$(date +%Y%m%d).md"
          python -m yatirim_ajani coz --veri csv --csv-klasoru veri/saatlik --aralik 1h || true
          python -m yatirim_ajani bilgi-olaylar --piyasa bist
          for f in bilgi_kaynak/*.json; do [ -f "$f" ] && python -m yatirim_ajani bilgi-yukle "$f" || true; done
          python -m yatirim_ajani simule --piyasa bist > /dev/null
          # Hisse dosyası ham verisi (kuyruk varsa onu, yoksa evreni çeker; hata işi durdurmaz)
          if [ -f veri/dosya/kuyruk.json ]; then
            HISSELER=$(python -c "import json;d=json.load(open('veri/dosya/kuyruk.json'));print(','.join(d.get('hisseler', [])))")
          fi
          python -m yatirim_ajani dosya-veri-cek --klasor veri/dosya/ham --baslangic 2024-01-01 --endeks XU100,XU030 ${HISSELER:+--hisseler "$HISSELER"} || echo "dosya-veri hata (devam)"

      - name: Saatlik tarama
        if: steps.is.outputs.ad == 'tara'
        working-directory: yatirim-ajani
        run: |
          python -m yatirim_ajani veri-cek --piyasa bist --baslangic "$(date -d '-10 days' +%Y-%m-%d)" --bes-dakika-yok
          python -m yatirim_ajani tara --piyasa bist --veri csv --csv-klasoru veri/saatlik --aralik 1h --saat-denetimi-kapali

      - name: Hisse dosyası ham verisi
        if: steps.is.outputs.ad == 'dosya-veri'
        working-directory: yatirim-ajani
        run: |
          python -m yatirim_ajani dosya-veri-cek --klasor veri/dosya/ham --baslangic "${{ inputs.baslangic }}" --endeks XU100,XU030 ${{ inputs.hisseler != '' && format('--hisseler "{0}"', inputs.hisseler) || '' }}
          head -c 1500 veri/dosya/ham/_cekim_raporu.json
          # Çözülen listenin saatlik çubukları (5 dk yok; Yahoo 730 gün sınırı)
          if [ -s veri/dosya/ham/_hisseler.txt ]; then
            python -m yatirim_ajani veri-cek --piyasa bist --hisseler "$(cat veri/dosya/ham/_hisseler.txt)" --bes-dakika-yok | tail -5 || echo "saatlik çekim hata (devam)"
          fi

      - name: Ağ katmanı ham verisi
        if: steps.is.outputs.ad == 'ag-veri'
        working-directory: yatirim-ajani
        run: |
          python -m yatirim_ajani ag-veri-cek --klasor veri/ag --baslangic "${{ inputs.baslangic }}" ${{ inputs.kaynak != '' && format('--kaynak "{0}"', inputs.kaynak) || '' }} ${{ inputs.hisseler != '' && format('--hisseler "{0}"', inputs.hisseler) || '' }}
          ls -la veri/ag | head -30

      - name: Çıktıları kaydet
        run: |
          rm -rf cikti/veri cikti/raporlar
          cp -r yatirim-ajani/veri cikti/ 2>/dev/null || true
          cp -r yatirim-ajani/raporlar cikti/ 2>/dev/null || true
          cd cikti
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -q -m "ajan çıktıları: ${{ steps.is.outputs.ad }} $(date '+%Y-%m-%d %H:%M %Z')"
          # İş sürerken dala başka bir commit gelmiş olabilir: önce üstüne al, sonra gönder (3 deneme)
          for i in 1 2 3; do
            git pull -q --rebase origin ajan-ciktilari && git push origin HEAD:ajan-ciktilari && exit 0
            sleep $((i * 10))
          done
          exit 1
