name: Yayınla (GitHub Pages)

# Her güncellemede uygulamayı derler ve https://<kullanıcı>.github.io/<depo>/ adresinde yayınlar.
# Bölüş (ortak harcama uygulaması) derleme gerektirmez; bolus/ klasörü olduğu gibi /bolus/ altında yayınlanır.
on:
  push:
    branches: [main, claude/merhaba-f982gj, claude/hopeful-johnson-m02kmc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bölüş uygulamasını ekle
        run: cp -r bolus dist/bolus
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
