# İthalat vergi tablosu: Çin menşeli eşya, ticari ithalat (normal gümrük beyannamesi).
#
# gv   = gümrük vergisi. Türkiye, Gümrük Birliği gereği üçüncü ülkelere AB Ortak Gümrük Tarifesi oranını uygular.
# igv  = ilave gümrük vergisi (serbest ticaret anlaşması olmayan menşe, Çin dahil).
# kdv  = ithalatta ödenen ve satışta indirilen KDV. Karşılaştırma KDV hariç yapılır, KDV nakit planı içindir.
# Matrah gümrük kıymetidir (CIF = mal + kargo + sigorta).
#
# guven = "kaynakli": oran ikincil kaynakla doğrulandı.
# guven = "tahmini": İGV doğrulanamadı; temkinli varsayım. Ajan bu ürünleri ayrıca +15 puan İGV ile sınar.
# Kesin oran 12 haneli GTİP'e bağlıdır. Sipariş öncesi gümrük müşavirine teyit ettirin.
#
# Bu dosya veridir. Bir oranı doğruladığınızda değeri, `kaynak` alanını ve en üstteki `surum` tarihini güncelleyin.

surum = "2026-11-09"

[kaynaklar]
gv = "GV: AB Ortak Gümrük Tarifesi (Türkiye Gümrük Birliği gereği üçüncü ülkelere aynı oranı uygular)."
igv_giyim = "İGV 61-62. fasıl %39 (önce %30): 7709 sayılı CK, RG 16.10.2023; İHKİB duyurusu."
igv_2025 = "İGV 2025: 64. fasıl ayakkabı %30→%40, 4202 çanta/valiz +9 puan → %39; TCS Global 2025 İGV çalışması."
kdv = "KDV: tekstil, hazır giyim, ayakkabı ve tekstil/deri çanta %10; diğerleri genel oran %20 (10.07.2023'ten beri)."
kargo_muafiyeti = "Posta/hızlı kargo 30 € muafiyeti 6 Şubat 2026'da kalktı (RG 07.01.2026). Bu rejim kişisel kullanım içindir; ticari satış için normal ithalat gerekir."

