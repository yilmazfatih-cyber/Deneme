query Library {
  library {
    myList {
      ...CardVideo
    }
    continueWatching {
      ...CardVideo
      ... on Show {
        currentEpisode {
          videoId
          numberLabel
          title
          runtimeSec
          bookmark {
            positionSec
            runtimeSec
            progress
          }
        }
      }
    }
    liked {
      ...CardVideo
    }
    favoriteChannels {
      ...ChannelCard
    }
  }
}
