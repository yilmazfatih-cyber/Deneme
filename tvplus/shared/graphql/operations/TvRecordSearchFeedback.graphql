mutation TvRecordSearchFeedback(
  $requestId: ID!
  $searchTerm: String!
  $unifiedEntityId: ID!
  $position: Int!
  $action: SearchFeedbackAction!
) {
  recordSearchFeedback(
    requestId: $requestId
    searchTerm: $searchTerm
    unifiedEntityId: $unifiedEntityId
    position: $position
    action: $action
  )
}
