# Akış kartları ("Yeni ve Popüler"): verilen başlıkların kart bilgisi, Listem durumu, önizlemesi ve eşleşme yüzdesi.
query FeedVideos($videoIds: [Int!]!) {
  videos(videoIds: $videoIds) {
    ...CardVideo
    isInPlaylist
    promoVideo {
      viewableId
      offset
      sourceKind
    }
    ... on Movie {
      matchScore
    }
    ... on Show {
      matchScore
    }
  }
}
