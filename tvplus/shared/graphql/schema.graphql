# TV+ GraphQL şeması (yeni API sistemi). İstemci asla ham sorgu yollamaz: yalnızca kalıcı sorgu kimliği + sürüm.
# Eski sistem (Falcor pathEvaluator) Film & Dizi ana sayfa satırlarını taşır; bkz. docs/MIMARI.md.

scalar DateTime

enum MembershipStatus {
  ANONYMOUS
  CURRENT_MEMBER
  FORMER_MEMBER
}
enum WatchStatus {
  NEVER_WATCHED
  STARTED
  WATCHED
}
enum ThumbRating {
  THUMBS_UNRATED
  THUMBS_DOWN
  THUMBS_UP
  THUMBS_WAY_UP
}
enum PlaylistAction {
  ADD_TO_PLAYLIST
  DELETE_FROM_PLAYLIST
}
"Etiket biçimi: BOB = önizleme kartı (kısa), ODP = detay sayfası (uzun)"
enum TextEvidenceUiContext {
  BOB
  ODP
}
enum AccessState {
  PLAYABLE
  UPSELL
  DEVICE_RESTRICTED
  OUT_OF_WINDOW
  BLOCKED
}
enum LiveState {
  UPCOMING
  LIVE
  ENDED
}
enum EntityKind {
  VIDEO
  CHANNEL
  PROGRAM_AIRING
  PERSON
  GENERIC_CONTAINER
}
enum ArtworkType {
  "Dikey 2:3 afiş"
  BOXART
  "Yatay 16:9 kart"
  STORY_ART
  "Geniş vitrin görseli"
  BILLBOARD
  "Başlık logosu (şeffaf zemin)"
  TITLE_LOGO
  "Bölüm karesi 16:9"
  EPISODE_STILL
  CHANNEL_LOGO
  AVATAR
}
"Oynatmanın nasıl taşındığı"
enum SourceKind {
  OWN_CDN
  YOUTUBE
  PROGRESSIVE
}
enum RowType {
  LIVE_HERO
  CHANNEL_ROW
  TONIGHT_ROW
  CATCHUP_ROW
  POSTER_ROW
  CONTINUE_ROW
  BRIDGE
}
enum SearchCorrectionMode {
  CORRECTED
  MIXED
}
enum SupplementalType {
  TRAILER
  TEASER
  BEHIND_THE_SCENES
}
enum CardBadgeKind {
  NEW
  NEW_EPISODE
  EXCLUSIVE
  LEAVING_SOON
  TOP10
  LIVE
  LOCKED
}

"Görsel servisi adresi. Boyut istemciden istenir; adres imzalıdır (r=)."
type Artwork {
  key: String!
  type: ArtworkType!
  url: String!
  width: Int!
  height: Int!
}
input ArtworkParams {
  width: Int
  height: Int
  "webp (varsayılan) | jpg"
  format: String
}

type Access {
  state: AccessState!
  "Kullanıcıya gösterilen tek satır gerekçe; PLAYABLE ise null"
  reasonText: String
  requiredProduct: String
  requiredProductName: String
  cta: String
}

type Person {
  personId: Int!
  unifiedEntityId: ID!
  name: String!
  videos: [Video!]!
}
type Genre {
  genreId: Int!
  unifiedEntityId: ID!
  name: String!
  videos(first: Int = 40): [Video!]!
}
type MoodTag {
  id: Int!
  displayName: String!
  isMood: Boolean!
}
"RTÜK akıllı işaretleri"
type ContentAdvisory {
  certificationValue: String!
  maturityLevel: Int!
  boardName: String!
  reasons: [String!]!
}
type Bookmark {
  positionSec: Int!
  runtimeSec: Int
  lastModified: DateTime!
  "0–1 arası ilerleme"
  progress: Float!
}
type TextEvidence {
  key: String!
  text: String!
}
"Kart üzerindeki tek rozet (tasarım kuralı: kart başına en çok 1)"
type CardBadge {
  kind: CardBadgeKind!
  text: String!
}
type License {
  name: String!
  attribution: String!
  url: String
}
"Önizleme (hover) klibi: hangi oynatılabilirin kaçıncı saniyesinden"
type PromoVideo {
  "Oynatma servisine verilecek kimlik (manifest isteğinde promo=true ile)"
  viewableId: ID!
  computeId: String!
  offset: Int!
  sourceKind: SourceKind!
}

interface Video {
  videoId: Int!
  unifiedEntityId: ID!
  title: String!
  shortSynopsis: String!
  synopsis: String!
  "Bağlama göre özet (devam eden dizide sıradaki bölümün özeti vb.)"
  contextualSynopsis: String!
  latestYear: Int
  isAvailable: Boolean!
  isPlayable: Boolean!
  access: Access!
  artwork(type: ArtworkType!, params: ArtworkParams): Artwork!
  genreTags: [Genre!]!
  moodTags: [MoodTag!]!
  contentAdvisory: ContentAdvisory!
  playbackBadges: [String!]!
  sourceKinds: [SourceKind!]!
  watchStatus: WatchStatus!
  bookmark: Bookmark
  thumbRating: ThumbRating!
  isInPlaylist: Boolean!
  playlistActions: [PlaylistAction!]!
  textEvidence(uiContext: TextEvidenceUiContext = BOB): [TextEvidence!]!
  promoVideo: PromoVideo
  badge: CardBadge
  runtimeSec: Int
  "Kart altı kısa bilgi: '1 sa 28 dk' · '2 Sezon' · 'S1 B3'"
  displayRuntime: String!
  license: License
  isKids: Boolean!
  "Bugünün Top 10 sırası (1–10) ya da null"
  top10Rank: Int
}

type Movie implements Video {
  videoId: Int!
  unifiedEntityId: ID!
  title: String!
  shortSynopsis: String!
  synopsis: String!
  contextualSynopsis: String!
  latestYear: Int
  isAvailable: Boolean!
  isPlayable: Boolean!
  access: Access!
  artwork(type: ArtworkType!, params: ArtworkParams): Artwork!
  genreTags: [Genre!]!
  moodTags: [MoodTag!]!
  contentAdvisory: ContentAdvisory!
  playbackBadges: [String!]!
  sourceKinds: [SourceKind!]!
  watchStatus: WatchStatus!
  bookmark: Bookmark
  thumbRating: ThumbRating!
  isInPlaylist: Boolean!
  playlistActions: [PlaylistAction!]!
  textEvidence(uiContext: TextEvidenceUiContext = BOB): [TextEvidence!]!
  promoVideo: PromoVideo
  badge: CardBadge
  runtimeSec: Int
  displayRuntime: String!
  license: License
  isKids: Boolean!
  top10Rank: Int
  originalTitle: String
  cast: [Person!]!
  directors: [Person!]!
  creators: [Person!]!
  similars(first: Int = 12): [Video!]!
  supplementalVideos: [Supplemental!]!
  collections: [Collection!]!
}

type Show implements Video {
  videoId: Int!
  unifiedEntityId: ID!
  title: String!
  shortSynopsis: String!
  synopsis: String!
  contextualSynopsis: String!
  latestYear: Int
  isAvailable: Boolean!
  isPlayable: Boolean!
  access: Access!
  artwork(type: ArtworkType!, params: ArtworkParams): Artwork!
  genreTags: [Genre!]!
  moodTags: [MoodTag!]!
  contentAdvisory: ContentAdvisory!
  playbackBadges: [String!]!
  sourceKinds: [SourceKind!]!
  watchStatus: WatchStatus!
  bookmark: Bookmark
  thumbRating: ThumbRating!
  isInPlaylist: Boolean!
  playlistActions: [PlaylistAction!]!
  textEvidence(uiContext: TextEvidenceUiContext = BOB): [TextEvidence!]!
  promoVideo: PromoVideo
  badge: CardBadge
  runtimeSec: Int
  displayRuntime: String!
  license: License
  isKids: Boolean!
  top10Rank: Int
  originalTitle: String
  cast: [Person!]!
  directors: [Person!]!
  creators: [Person!]!
  similars(first: Int = 12): [Video!]!
  supplementalVideos: [Supplemental!]!
  collections: [Collection!]!
  seasons: [Season!]!
  seasonCount: Int!
  episodeCount: Int!
  "Kaldığı yerden devam edilecek (ya da ilk) bölüm"
  currentEpisode: Episode!
}

type Season {
  seasonId: ID!
  number: Int!
  "S1"
  numberLabel: String!
  title: String
  episodes: [Episode!]!
}

type Episode implements Video {
  videoId: Int!
  unifiedEntityId: ID!
  title: String!
  shortSynopsis: String!
  synopsis: String!
  contextualSynopsis: String!
  latestYear: Int
  isAvailable: Boolean!
  isPlayable: Boolean!
  access: Access!
  artwork(type: ArtworkType!, params: ArtworkParams): Artwork!
  genreTags: [Genre!]!
  moodTags: [MoodTag!]!
  contentAdvisory: ContentAdvisory!
  playbackBadges: [String!]!
  sourceKinds: [SourceKind!]!
  watchStatus: WatchStatus!
  bookmark: Bookmark
  thumbRating: ThumbRating!
  isInPlaylist: Boolean!
  playlistActions: [PlaylistAction!]!
  textEvidence(uiContext: TextEvidenceUiContext = BOB): [TextEvidence!]!
  promoVideo: PromoVideo
  badge: CardBadge
  runtimeSec: Int
  displayRuntime: String!
  license: License
  isKids: Boolean!
  top10Rank: Int
  number: Int!
  seasonNumber: Int!
  "S1 B3"
  numberLabel: String!
  parentShow: Show!
  nextEpisode: Episode
}

"Fragman ve benzeri ek videolar"
type Supplemental implements Video {
  videoId: Int!
  unifiedEntityId: ID!
  title: String!
  shortSynopsis: String!
  synopsis: String!
  contextualSynopsis: String!
  latestYear: Int
  isAvailable: Boolean!
  isPlayable: Boolean!
  access: Access!
  artwork(type: ArtworkType!, params: ArtworkParams): Artwork!
  genreTags: [Genre!]!
  moodTags: [MoodTag!]!
  contentAdvisory: ContentAdvisory!
  playbackBadges: [String!]!
  sourceKinds: [SourceKind!]!
  watchStatus: WatchStatus!
  bookmark: Bookmark
  thumbRating: ThumbRating!
  isInPlaylist: Boolean!
  playlistActions: [PlaylistAction!]!
  textEvidence(uiContext: TextEvidenceUiContext = BOB): [TextEvidence!]!
  promoVideo: PromoVideo
  badge: CardBadge
  runtimeSec: Int
  displayRuntime: String!
  license: License
  isKids: Boolean!
  top10Rank: Int
  subType: SupplementalType!
  parent: Video!
}

"Birlikte aranabilen/gezilebilen başlık grubu (Netflix Collection varlığı)"
type Collection {
  collectionId: Int!
  unifiedEntityId: ID!
  name: String!
  description: String!
  videos: [Video!]!
  artwork(params: ArtworkParams): Artwork!
}

# ───────────── Canlı TV ─────────────

type Channel {
  channelId: Int!
  unifiedEntityId: ID!
  name: String!
  number: Int!
  category: String!
  categoryName: String!
  description: String!
  logo(params: ArtworkParams): Artwork!
  isHd: Boolean!
  isFavorite: Boolean!
  isKids: Boolean!
  access: Access!
  sourceKind: SourceKind!
  "true → yayın akışı örnek veridir (gerçek kanalın gerçek akışı değildir)"
  isSampleSchedule: Boolean!
  now: ProgramAiring
  next: ProgramAiring
  airings(from: DateTime!, to: DateTime!): [ProgramAiring!]!
}

type Catchup {
  available: Boolean!
  until: DateTime
}

type ProgramAiring {
  airingId: ID!
  unifiedEntityId: ID!
  channel: Channel!
  title: String!
  synopsis: String!
  "haber | film | dizi | spor | belgesel | cocuk | program | muzik"
  kind: String!
  startAt: DateTime!
  endAt: DateTime!
  liveState: LiveState!
  "Program başladıktan sonra baştan izlenebilir mi"
  startOver: Boolean!
  catchup: Catchup!
  "Katalogdaki karşılığı (varsa)"
  video: Video
  artwork(params: ArtworkParams): Artwork!
  access: Access!
}

# ───────────── Sayfa şeması: Page → rows[] → items[] ─────────────

"Her kart hangi satırın kaçıncı sırasında gösterildiğini taşır (tctx)"
type Track {
  row: Int!
  pos: Int!
  rowId: ID!
  trackId: Int!
  entityId: ID!
  tctx: String!
}
union RowEntity = Movie | Show | Episode | Channel | ProgramAiring | Collection
type RowItem {
  kind: EntityKind!
  track: Track!
  entity: RowEntity!
}
type PageRow {
  rowId: ID!
  type: RowType!
  title: String
  "Satırın yeniden çekilme süresi (canlı satırlar 30–60 sn)"
  ttlSec: Int!
  trackId: Int!
  items: [RowItem!]!
  "BRIDGE satırında hedef mod: 'film-dizi' | 'canli'"
  bridgeTo: String
}
type Page {
  id: ID!
  expires: DateTime!
  serverTime: DateTime!
  rows: [PageRow!]!
}
"İstemci çizebildiği satır tiplerini ve varlık türlerini bildirir; sunucu tanınmayanı hiç yollamaz"
input PageCapabilitiesInput {
  rowTypes: [RowType!]!
  entityKinds: [EntityKind!]!
}

# ───────────── Arama (yetenek pazarlığı) ─────────────

input EntityTreatmentCapabilityInput {
  canHandleEntityKinds: [EntityKind!]!
}
input EntityTreatmentCapabilitiesInput {
  standardBoxshot: EntityTreatmentCapabilityInput
  standardChannelTile: EntityTreatmentCapabilityInput
  standardAiringRow: EntityTreatmentCapabilityInput
  standardPersonChip: EntityTreatmentCapabilityInput
  standardDestination: EntityTreatmentCapabilityInput
  standardSuggestion: EntityTreatmentCapabilityInput
}
input TreatmentCapabilitiesInput {
  capabilitiesByEntityTreatment: EntityTreatmentCapabilitiesInput!
}
input SectionTreatmentCapabilitiesInput {
  standard: TreatmentCapabilitiesInput
}
input SectionCapabilitiesInput {
  capabilitiesBySectionTreatment: SectionTreatmentCapabilitiesInput!
}
input CapabilitiesBySectionInput {
  searchList: SectionCapabilitiesInput
  searchGallery: SectionCapabilitiesInput
  searchLive: SectionCapabilitiesInput
}
input SearchPageCapabilitiesInput {
  capabilitiesBySection: CapabilitiesBySectionInput!
}
input SearchFiltersInput {
  genreIds: [Int!]
  "all | film | dizi"
  kind: String
  "all | 2020 | 2010 | old"
  year: String
  "true → yalnız paketimde olanlar"
  entitledOnly: Boolean
  "rel | new | az"
  sort: String
}
input SearchOptionsInput {
  pageCapabilities: SearchPageCapabilitiesInput!
  filters: SearchFiltersInput
  pageSize: Int
}

type SearchEntity {
  unifiedEntityId: ID!
  kind: EntityKind!
  displayString: String!
  "Çizim biçimi: standardBoxshot | standardChannelTile | standardAiringRow | standardPersonChip | standardDestination | standardSuggestion"
  treatment: String!
  track: Track!
  "Yazım düzeltmesiyle bulunduysa true"
  fuzzy: Boolean!
  video: Video
  channel: Channel
  airing: ProgramAiring
  person: Person
  collection: Collection
  genre: Genre
  "Sorgu bağlamına göre seçilmiş görsel"
  contextualArtwork: Artwork
}
interface SearchSection {
  id: ID!
  displayString: String!
  "Bölüm bazında yaşam süresi: katalog saatler, canlı 60 sn"
  expires: DateTime!
  entities: [SearchEntity!]!
}
"Öneri listesi ('Keşfetmeye devam et')"
type SearchListSection implements SearchSection {
  id: ID!
  displayString: String!
  expires: DateTime!
  entities: [SearchEntity!]!
}
"Sonuç ızgarası ('Film ve Diziler')"
type SearchGallerySection implements SearchSection {
  id: ID!
  displayString: String!
  expires: DateTime!
  entities: [SearchEntity!]!
  totalCount: Int!
}
"Şu an canlı / yayın akışı sonuçları"
type SearchLiveSection implements SearchSection {
  id: ID!
  displayString: String!
  expires: DateTime!
  entities: [SearchEntity!]!
}
type SearchCorrection {
  mode: SearchCorrectionMode!
  originalTerm: String!
  correctedTerm: String!
}
type SearchPage {
  searchTerm: String!
  requestId: ID!
  trackId: Int!
  "Tüm sayfanın yaşam süresi (en kısa bölümünki)"
  expires: DateTime!
  correction: SearchCorrection
  sections: [SearchSection!]!
  "Sonuç yoksa gösterilecek yedek bölümler (popüler + şu an canlı)"
  isFallback: Boolean!
  recentSearches: [String!]!
}

# ───────────── Üyelik / profil ─────────────

type Profile {
  guid: ID!
  name: String!
  avatar(params: ArtworkParams): Artwork!
  isKids: Boolean!
  maturityLevel: Int!
  isActive: Boolean!
}
type Account {
  accountId: ID!
  planName: String!
  products: [String!]!
  profiles: [Profile!]!
}
type MembershipStatusResult {
  status: MembershipStatus!
  account: Account
  activeProfile: Profile
}

"Göz atma sayfası üstü duyuru (Netflix CLCS interstitial karşılığı)"
type Interstitial {
  id: ID!
  location: String!
  title: String!
  body: String!
  cta: String!
  href: String!
}

type Notification {
  id: ID!
  kind: String!
  title: String!
  body: String!
  href: String
  createdAt: DateTime!
  read: Boolean!
}

"Oynatıcı kabuğunun gösterdiği üst veri (akışın kendisi MSL manifest ucundan gelir)"
type PlaybackMetadata {
  viewableId: ID!
  title: String!
  "S1 B3 · Bölüm adı | kanal adı"
  subtitle: String
  live: Boolean!
  video: Video
  channel: Channel
  airing: ProgramAiring
  nextEpisode: Episode
  "Jenerik başlangıcı (sn); sonraki bölüm önerisi bu andan sonra çıkar"
  creditsOffsetSec: Int
  bookmark: Bookmark
  access: Access!
  "Komşu kanallar (zap ve manifest ön hazırlığı için)"
  previousChannel: Channel
  nextChannel: Channel
}

type PlaylistResult {
  video: Video!
  isInPlaylist: Boolean!
}
type ThumbResult {
  video: Video!
  thumbRating: ThumbRating!
}
type BookmarkResult {
  viewableId: ID!
  bookmark: Bookmark
  watchStatus: WatchStatus!
}

type Library {
  myList: [Video!]!
  continueWatching: [Video!]!
  liked: [Video!]!
  favoriteChannels: [Channel!]!
}

type Query {
  membershipStatus: MembershipStatusResult!
  video(videoId: Int!): Video
  videos(videoIds: [Int!]!): [Video]!
  collection(collectionId: Int!): Collection
  person(personId: Int!): Person
  genre(genreId: Int!): Genre
  channel(channelId: Int!): Channel
  channels(category: String, favoritesOnly: Boolean): [Channel!]!
  airing(airingId: ID!): ProgramAiring
  "Canlı TV ana sayfası (yeni sistem). Film & Dizi satırları eski sistemden (Falcor) gelir."
  livePage(capabilities: PageCapabilitiesInput!): Page!
  searchPage(searchTerm: String!, options: SearchOptionsInput!): SearchPage!
  library: Library!
  interstitial(location: String!): Interstitial
  notifications: [Notification!]!
  playbackMetadata(viewableId: ID!): PlaybackMetadata
}

type Mutation {
  addToPlaylist(videoId: Int!, tctx: String): PlaylistResult!
  removeFromPlaylist(videoId: Int!): PlaylistResult!
  setThumbRating(videoId: Int!, rating: ThumbRating!): ThumbResult!
  "Oynatıcı kalp atışı: konumu kaydeder, watchStatus'u günceller"
  setBookmark(viewableId: ID!, positionSec: Int!, durationSec: Int): BookmarkResult!
  setLastChannel(channelId: Int!): Boolean!
  toggleFavoriteChannel(channelId: Int!): Channel!
  dismissInterstitial(id: ID!): Boolean!
  recordSearch(term: String!): Boolean!
  clearRecentSearches: Boolean!
  markNotificationsRead(ids: [ID!]): Boolean!
}
