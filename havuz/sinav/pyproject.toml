[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "havuz-sinav"
version = "0.1.0"
description = "Kod ajanı sınavı: havuz temelleri üstünde gerçekçi görevler, gizli testlerle otomatik puanlama."
readme = "README.md"
requires-python = ">=3.11"
# Çalışma zamanı bağımlılığı YOK: sınav yalnız Python standart kütüphanesiyle çalışır (docs/KARARLAR.md, K02).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.17", "mypy>=2.4"]

[tool.setuptools.packages.find]
include = ["exam*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "calisma"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PT"]
ignore = [
  "E501",   # satır uzunluğunu biçimleyici (ruff format) yönetir; görev betiklerindeki uzun metinler hata sayılmaz
  "RUF001", # Türkçe harfler (ı, İ) "belirsiz karakter" sayılmasın
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Gizli testler temellerin kendi test üslubuyla yazılır (X matris adı, birleşik doğrulama).
"gorevler/*/gizli/*" = ["N806", "PT011", "PT018", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["exam"]

[tool.mypy]
python_version = "3.11"
# Görev betikleri (gorevler/*/hazirla.py …) aynı adı taşıdığından mypy'ye verilmez; ruff ve
# `tests/test_gorevler.py` (her betik yüklenir ve temele uygulanır) onları denetler.
files = ["exam", "sinav.py", "scripts", "tests"]
mypy_path = "../araclar"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Havuzun ortak araçları (havuz/araclar) yeniden kullanılır; onların iç tipleri bu temelin işi değildir.
module = ["denetle", "ortak", "yeni_proje"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --strict-markers"
markers = ["tam: bütün görevleri baştan sona doğrular (yavaş; SINAV_TAM=1 ile açılır)"]
