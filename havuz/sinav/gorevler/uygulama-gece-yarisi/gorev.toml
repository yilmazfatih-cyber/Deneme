temel = "uygulama"
zorluk = "zor"
tur = "hata"
tahmini_sure_dk = 25
aciklama = """Yerel günü hesaplayan yardımcı UTC gününü veriyor (saat dilimi hatası). Belirti yalnız Türkiye'de \
gece 00.00–03.00 arasında görülür; mevcut testler bunu yakalamaz. Gizli test iki saat diliminde (İstanbul, \
New York) sınar: "3 saat ekle" gibi yamalar geçmez."""
baslangic_denetimi = "yesil"

[[gizli]]
