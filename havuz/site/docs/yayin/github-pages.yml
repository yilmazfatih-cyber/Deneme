# GitHub Pages ile yayın — KOPYALANACAK ÖRNEK.
# Kullanım: bu dosyayı deponuzda .github/workflows/yayin.yml olarak kopyalayın, ardından
# Settings → Pages → Build and deployment → Source: "GitHub Actions" seçin. main dalına her gönderimde site
# denetlenir, derlenir ve yayınlanır.
#
# Adres: configure-pages adımı sitenin gerçek adresini verir (proje sitesinde https://kullanici.github.io/depo-adi,
# özel alan adında https://www.ornek.com). SITE_URL bu değerle verilir; alt klasör (/depo-adi/) oradan çıkarılır.
#
# Site deponun bir alt klasöründeyse (ör. havuz/site/) aşağıdaki SITE_DIR değerini değiştirin.
# Eylem sürümleri Kasım 2026'da eylemlerin kendi belgelerinden doğrulandı.

name: Yayın

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_DIR: .

jobs:
  derle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SITE_DIR }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.SITE_DIR }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.SITE_DIR }}/package-lock.json

      - name: Pages adresini öğren
        id: pages
        uses: actions/configure-pages@v5

      - name: Paketleri kur
        run: npm ci

      - name: Denetle (tür, kod kuralları, testler, iki derleme + site denetimi)
        run: npm run check
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Yayın derlemesi
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Form servisi kullanıyorsanız depo ayarlarında (Settings → Secrets and variables → Actions → Variables)
          # PUBLIC_FORM_ENDPOINT adlı bir değişken tanımlayın; aşağıdaki satır onu derlemeye verir.
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_NEWSLETTER_ENDPOINT: ${{ vars.PUBLIC_NEWSLETTER_ENDPOINT }}

      - name: Derlemeyi Pages'e yükle
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}/dist

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v5
