[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-temel"
version = "0.1.0"
description = "Yalnız numpy ile sıfırdan makine öğrenmesi temeli: otomatik türev, sinir ağı katmanları, klasik modeller, değerlendirme ve CSV'den modele aracı."
readme = "README.md"
requires-python = ">=3.11"
# Tek çalışma zamanı bağımlılığı numpy'dır (gerekçe: docs/KARARLAR.md, K01).
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
# scikit-learn yalnız testlerde "başvuru gerçeklemesi" olarak kullanılır; paket onu içe aktarmaz.
dev = ["pytest>=9.0", "ruff>=0.17", "mypy>=2.4", "scikit-learn>=1.9"]

[project.scripts]
ml-temel = "ml_temel.__main__:main"

[tool.setuptools.packages.find]
include = ["ml_temel*"]

[tool.setuptools.package-data]
ml_temel = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "ciktilar"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PT", "PL"]
ignore = [
  "N803",    # X, Xs gibi matris adları makine öğrenmesinde yerleşik gösterimdir
  "N806",    # aynı gerekçe (yerel X, W, K…)
  "RUF001",  # Türkçe harfler (ı, İ) "belirsiz karakter" sayılmasın
  "RUF002",
  "RUF003",
  "PLR0913", # scikit-learn benzeri kurucular çok parametre alır
  "PLR0917",
  "PLR2004", # sayısal kodda küçük sabitler (0.5, 2, 1e-12) okunaklıdır
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLW2901", # döngü değişkenini bilerek yeniden atıyoruz (x = katman(x))
  "PLC0415", # isteğe bağlı içe aktarmalar (scikit-learn) fonksiyon içinde yapılır
  "SIM108",
  "E741",    # l, I gibi adlar matematik gösteriminde geçer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "PT011", "PT018", "B017"]
"ornekler/*" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["ml_temel"]

[tool.mypy]
python_version = "3.11"
files = ["ml_temel", "scripts", "ornekler"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --strict-markers"
markers = [
  "yavas: uzun süren test (hızlı denetimde atlanır; `python scripts/check.py --uzun` ile koşar)",
]
filterwarnings = ["error::RuntimeWarning:ml_temel"]

[[tool.mypy.overrides]]
# scikit-learn yalnız karşılaştırma için (testler ve ölçüm betiği) kullanılır; tip tanımı yoktur.
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
