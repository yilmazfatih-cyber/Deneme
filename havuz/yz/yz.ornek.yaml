# yz yapılandırma örneği. Kullanmak için bu dosyayı yz.yaml adıyla kopyalayın ve düzenleyin:
#     cp yz.ornek.yaml yz.yaml
# yz.yaml depoya girmez (.gitignore). SIRLARI (API anahtarı) buraya YAZMAYIN: dosyada yalnız
# anahtarı taşıyan ORTAM DEĞİŞKENİNİN ADI durur (api_anahtari_ortam).
# Model adları, adresler ve fiyatlar çabuk eskir; kendi kurulumunuza göre değiştirin.

varsayilan: ollama            # --saglayici verilmezse kullanılacak profil

saglayicilar:
  ollama:                     # https://ollama.com — `ollama serve` + `ollama pull <model>`
    tur: openai_uyumlu
    taban_url: http://localhost:11434/v1
    model: qwen2.5:0.5b       # örnek; `python -m yz modeller` ile sunucudaki adları görün
    yapili_kip: json_sema     # Ollama response_format json_schema'yı `format` alanına çevirir
    azami_belirtec: 1024
    gomme_modeli: nomic-embed-text   # `indeksle --gomme saglayici` için (önce ollama pull)

  llamacpp:                   # llama.cpp sunucusu: llama-server -m model.gguf --jinja --port 8080
    tur: openai_uyumlu
    taban_url: http://localhost:8080/v1
    model: yerel
    yapili_kip: gbnf          # şemadan GBNF dilbilgisi üretilip `grammar` alanıyla gönderilir

  lmstudio:                   # LM Studio yerel sunucusu
    tur: openai_uyumlu
    taban_url: http://localhost:1234/v1
    model: yerel-model

  dil_modeli:                 # havuz/dil-modeli temelinin kendi eğittiği model (kapı 8430)
    tur: openai_uyumlu
    taban_url: http://localhost:8430/v1
    model: dil-modeli
    yapili_kip: kapali        # bu sunucunun yapılı çıktı desteği doğrulanmadı; istem katmanı kullanılır

  hf:                         # araclar/hf_sunucu.py (transformers ile CPU'da geliştirme sunucusu)
    tur: openai_uyumlu
    taban_url: http://127.0.0.1:8422/v1
    model: qwen25-05b
    zaman_asimi_sn: 600

  openrouter:                 # bulut: birçok küçük modele tek uçtan erişim
    tur: openai_uyumlu
    taban_url: https://openrouter.ai/api/v1
    model: <openrouter-model-kimligi>
    api_anahtari_ortam: OPENROUTER_API_KEY

  anthropic:                  # isteğe bağlı: uv pip install -e ".[anthropic]"; ANTHROPIC_API_KEY gerekir
    tur: anthropic
    model: claude-opus-5-5    # güncel adlar için: python -m yz modeller --saglayici anthropic
    api_anahtari_ortam: ANTHROPIC_API_KEY
    azami_belirtec: 4096
    ek:
      ret_yedegi_beta: server-side-fallback-2026-07-01   # reddedilen istek sunucu tarafında yedek modele gider

# Maliyet tablosu: 1 milyon belirteç başına fiyat, KENDİ kaynağınızdan doldurun (kodda fiyat yoktur).
# Tabloda olmayan modelin maliyeti "bilinmiyor" yazılır. Kalıp kullanılabilir ("qwen*").
para_birimi: USD
fiyatlar:
  "qwen*": {girdi: 0.0, cikti: 0.0}     # yerel model: ücretsiz
  # <model-adı>: {girdi: <1M girdi fiyatı>, cikti: <1M çıktı fiyatı>}

veri_dizini: .yz              # önbellek, günlük, RAG dizini, değerlendirme sonuçları
onbellek: false               # true: aynı istek ikinci kez modele gitmez (geliştirme/değerlendirme)
gunluk: true                  # .yz/gunluk.jsonl (kişisel veri ve sırlar maskeli yazılır)

sunucu:
  adres: 127.0.0.1            # başka cihazlardan erişim için 0.0.0.0 + API anahtarı gerekir
  kapi: 8420
  api_anahtari_ortam: YZ_SUNUCU_ANAHTARI
  maskele: true               # TCKN, IBAN, telefon… modele gitmeden maskelenir, yanıtta geri açılır
  azami_yukleme_bayt: 10485760
  izinli_kokenler: []         # CORS kapalı (aynı adresten açılan arayüz için gerekmez)
