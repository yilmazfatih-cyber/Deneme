[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "havuz-algoritma"
version = "0.1.0"
description = "Okunaklı, testle kanıtlanmış, Türkçe açıklamalı algoritmalar ve veri yapıları kütüphanesi (yalnız stdlib)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Çalışma zamanı bağımlılığı YOK: her modül yalnız Python standart kütüphanesini kullanır (docs/KARARLAR.md, K01).
dependencies = []

[project.optional-dependencies]
# Yalnız geliştirme: test (pytest + hypothesis), lint/biçim (ruff), tip denetimi (mypy).
dev = ["pytest>=9.0", "hypothesis>=6.150", "ruff>=0.17", "mypy>=2.4"]

[tool.setuptools.packages.find]
include = ["algoritma*"]

[tool.setuptools.package-data]
algoritma = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PT", "PLE", "PLW", "PLC"]
ignore = [
  "RUF001",  # Türkçe harfler (ı, İ) "belirsiz karakter" sayılmasın
  "RUF002",
  "RUF003",
  "N803",    # n, V, E, A gibi adlar algoritma gösteriminde yerleşiktir
  "N806",    # INF, MOD gibi yerel sabitler
  "B905",    # zip(strict=) her yerde gerekmez; uzunluklar çağıran tarafından güvence altında
  "SIM102",  # iç içe if bazen algoritmanın adımlarını daha açık gösterir
  "SIM103",
  "SIM108",  # üçlü ifade yerine açık if/else okunaklılık için serbest
  "SIM110",  # any/all yerine açık döngü serbest (adım adım okunur)
  "SIM114",
  "PLW2901", # döngü değişkenini bilerek güncelliyoruz
  "PLC0415", # döngüsel bağımlılığı önlemek için fonksiyon içi içe aktarma serbest
  "E741",    # l, I, O adlarından zaten kaçınıyoruz; matematik gösteriminde gerekirse serbest
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "PT018", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["algoritma", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["algoritma", "scripts", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests", "algoritma"]
addopts = "-q -p no:cacheprovider --strict-markers --doctest-modules"
markers = [
  "yavas: uzun süren test (hızlı denetimde atlanır; `python scripts/check.py --uzun` ile koşar)",
]
