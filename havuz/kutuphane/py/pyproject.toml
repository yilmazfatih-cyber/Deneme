[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "havuz-kutuphane"
version = "0.1.0"
description = "Tek dosyalık, bağımlılıksız, testli yardımcı modüller (Python yarısı)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.*", "ruff==0.17.*", "mypy==2.4.*"]

[tool.setuptools]
packages = ["kutuphane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
faulthandler_timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PT"]
ignore = [
  "E501",   # satır uzunluğunu biçimleyici (ruff format) yönetir; uzun belge/yorum satırı hata sayılmaz
  "PT011",  # vektör testleri yalnız "ValueError türevi bir hata" bekler
  "RUF001", # Türkçe harfler (ı, İ) "belirsiz karakter" sayılmaz
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["kutuphane", "tests", "scripts", "kopyala.py"]
