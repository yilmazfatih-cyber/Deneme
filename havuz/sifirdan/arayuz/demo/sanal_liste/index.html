<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Sanal liste — sıfırdan arayüz</title>
    <link rel="stylesheet" href="../ortak/stil.css" />

  <body>
    <header class="ust">
      <div class="kap">
        <a class="geri" href="../../">← Tüm gösterimler</a>
        <h1>Sanal liste: 10.000 mesaj</h1>
        <p class="alt-baslik">
          Mesajlar farklı uzunlukta. DOM'da yalnız görünenler var; aşağıdaki sayaç kaç öğenin çizildiğini gösterir.
          Listeye odaklanıp ok tuşları ya da <kbd>Page Down</kbd> ile kaydırın.
        </p>
      </div>
    </header>
    <main class="kap" id="icerik">
      <div class="satir arac">
        <button type="button" id="basa">Başa</button>
        <button type="button" id="ortaya" class="birincil">5.000. mesaja git</button>
        <button type="button" id="sona">Sona</button>
      </div>
      <p class="durum" id="sayac" aria-live="polite"></p>
      <div id="liste" class="liste"></div>
    </main>
    <script type="module" src="./main.ts"></script>
