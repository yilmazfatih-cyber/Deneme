# Açık veri kümeleri kataloğu (Hugging Face).
# Her kayıt API'yle doğrulanır: python scripts/verify_catalog.py → katalog/dogrulama-<tarih>.json
# Alanlar: kimlik · gorev · alan · dil · boyut (HF size_categories etiketi) · lisans (HF license etiketleri)
# ticari_kullanim (evet/hayir/belirsiz; kural: docs/LISANSLAR.md) · atif · not
# Bu katalog hukuki danışmanlık değildir; kullanmadan önce kümenin kartını ve lisansını okuyun.
kumeler:
  - kimlik: wikimedia/wikipedia
    gorev: derlem
    alan: tr-dogal-dil
    dil: [tr, cok-dilli]
    boyut: "10M<n<100M"
    lisans: "cc-by-sa-3.0, gfdl"
    ticari_kullanim: evet
    atif: "wikimedia · https://huggingface.co/datasets/wikimedia/wikipedia (bilimsel atıf: veri kartının Citation bölümü)"
    not: "Türkçe alt küme: 20231101.tr (klasör API'de doğrulandı). Çok dilli."
