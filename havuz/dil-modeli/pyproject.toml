[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dil-modeli"
version = "0.1.0"
description = "Sıfırdan dil modeli temeli: tokenizer, LLaMA uyumlu model, eğitim, üretim, ince ayar, dışa aktarım, sunum."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=2.0",
  "safetensors>=0.4",
]

[project.optional-dependencies]
# Geliştirme ve hızlı denetim (python scripts/check.py) için gerekenler.
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "mypy>=1.13",
  "tokenizers>=0.20",
  "fastapi>=0.115",
  "httpx>=0.27",
]
# OpenAI uyumlu sunucu (python -m dil_modeli sun).
sun = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
# Hugging Face dünyası: dışa aktarım eşlik testleri, örnek veri indirme, hızlı tokenizer.
hf = [
  "transformers>=4.45",
  "tokenizers>=0.20",
  "huggingface-hub>=0.25",
  "pyarrow>=17",
]
# ONNX dışa aktarım ve onnxruntime ile eşlik testi (isteğe bağlı).
onnx = [
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript>=0.2",
]

[tool.setuptools]
packages = ["dil_modeli"]

[tool.setuptools.package-data]
dil_modeli = ["py.typed", "*.html", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "calisma", "veri"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = [
  "RUF001", # Türkçe metinlerde 'ı' gibi harfler "belirsiz karakter" sayılmasın
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["dil_modeli", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["safetensors.*", "tokenizers.*", "transformers.*", "pyarrow.*", "huggingface_hub.*", "onnx.*", "onnxruntime.*", "onnxscript.*", "gguf.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not uzun' -p no:cacheprovider"
markers = [
  "uzun: yavaş ya da ağır bağımlılık isteyen test (python scripts/check.py --uzun ile koşar)",
]
filterwarnings = ["error::DeprecationWarning:dil_modeli"]
