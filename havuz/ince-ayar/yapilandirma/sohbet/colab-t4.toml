# Sohbet · colab-t4: ücretsiz Colab/Kaggle T4 (16 GB, bf16 yok → fp16). Qwen3-1.7B + LoRA.
# Bellek tahmini için: python -m ince_ayar sohbet egit --hazir colab-t4 --kuru
# Kendi verinizi vermek için: -D veri.egitim=veri/sohbet.jsonl
gorev = "sohbet"

[model]
taban = "Qwen/Qwen3-1.7B"
duyarlik = "oto"
dort_bit = false

[veri]
egitim = "ornekler/sohbet.jsonl"
dogrulama_orani = 0.1
azami_uzunluk = 1024
grup_alani = "grup"

[lora]
r = 16
alpha = 32
dropout = 0.05
hedef_moduller = "all-linear"

[egitim]
cikti = "ciktilar/sohbet-t4"
donem = 2.0
yigin = 4
biriktirme = 4
degerlendirme_yigini = 4
ogrenme_orani = 2e-4
zamanlayici = "cosine"
isinma_orani = 0.03
gradyan_denetimi = true
kayit_adimi = 10
hedef_bellek_gb = 15.0

[degerlendirme]
azami_yeni_belirtec = 256
ornek_sayisi = 50
