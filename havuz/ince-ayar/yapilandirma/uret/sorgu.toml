# Sentetik arama sorgusu üretimi (gömme verisi): her belge için öğretmene sorgular yazdırılır.
#   python -m ince_ayar gomme uret --ayar yapilandirma/uret/sorgu.toml --sinir 2
# LİSANS: Üretilen veri öğretmenin lisansına tabidir (bkz. talimat.toml).
tarif = "sorgu"
girdi = "ornekler/tohumlar.jsonl"
cikti = "veri/uretilen-sorgu.jsonl"
ornek_sayisi = 4
tohum = 42

[ogretmen]
uc_nokta = "http://localhost:11434/v1"
model = "qwen3:8b"
lisans = "apache-2.0"
katalog_kimligi = "Qwen/Qwen3-8B"
sicaklik = 0.7
azami_belirtec = 1024
zaman_asimi = 300.0
yeniden_deneme = 3

[suzgec]
en_kisa_alan = 3
en_uzun_alan = 2000
dil = "tr"
turkce_esik = 0.5
yineleme_esigi = 0.85
ret_suzgeci = true
mevcut_veri = []
