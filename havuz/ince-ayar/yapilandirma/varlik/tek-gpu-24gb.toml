# Varlık tanıma · tek-gpu-24gb: 128k sözlüklü Türkçe BERT, daha uzun cümle.
gorev = "varlik"

[model]
taban = "dbmdz/bert-base-turkish-128k-cased"

[veri]
egitim = "ornekler/varlik.jsonl"
dogrulama_orani = 0.1
azami_uzunluk = 256

[egitim]
cikti = "ciktilar/varlik-24gb"
donem = 3.0
yigin = 32
degerlendirme_yigini = 64
ogrenme_orani = 5e-5
isinma_orani = 0.1
kayit_adimi = 20
hedef_bellek_gb = 24.0
