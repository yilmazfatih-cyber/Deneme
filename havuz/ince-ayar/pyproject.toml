[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ince-ayar"
version = "0.1.0"
description = "Açık modelleri ince ayarlama temeli: sohbet (LoRA), sınıflandırma, gömme; veri araçları ve sentetik veri hattı."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Eğitim yığını (sohbet + sınıflandırma + varlık tanıma).
egitim = [
  "torch>=2.6",
  "transformers>=5.0",
  "tokenizers>=0.22",
  "datasets>=4.0",
  "peft>=0.18",
  "trl>=1.0",
  "accelerate>=1.5",
  "safetensors>=0.5",
]
# Gömme (embedding) ince ayarı.
gomme = ["sentence-transformers>=5.0"]
# ONNX'e aktarım ve onnxruntime ile CPU çıkarımı.
onnx = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.3"]
# Geliştirme: denetim araçları + bütün ekstralar (testler hepsini ister).
dev = [
  "ince-ayar[egitim,gomme,onnx]",
  "pytest>=8.3",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["ince_ayar*"]
