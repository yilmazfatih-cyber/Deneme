# Model kataloğu — görev ve boyuta göre önerilen açık taban modeller.
#
# Her kayıt 16 Kasım 2026'da Hugging Face API'siyle doğrulandı (scripts/katalog_dogrula.py);
# ham sonuç: katalog/dogrulama-2026-11-16.json. `lisans`, `parametre` ve `erisim` API'den okunan
# değerlerdir; `ticari` lisans etiketinden çıkarılır (evet / kosullu / hayir, bkz. ince_ayar/catalog.py).
# `turkce`: "kanıt: …" yalnız dil etiketlerinde Türkçe varsa ya da model kartı Türkçe'yi anıyorsa yazılır;
# bu, modelin Türkçe'de İYİ olduğunu göstermez — yalnız Türkçe'nin kapsamda olduğunu gösterir.
# Bu temelde hangi modelin gerçekten denendiği docs/DENEME_KAYDI.md içindedir; diğerleri DENENMEDİ.
# Yeni kayıt ekledikten sonra: .venv/bin/python scripts/katalog_dogrula.py --yaz

