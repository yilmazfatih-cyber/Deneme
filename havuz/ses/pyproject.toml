[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "havuz-ses"
version = "0.1.0"
description = "Türkçe ses temeli: konuşmayı yazıya çevirme, metni seslendirme, ses yardımcıları, ölçüm ve OpenAI uyumlu sunucu."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Konuşma → yazı (faster-whisper; CTranslate2 Whisper modelleri)
stt = ["faster-whisper>=1.2,<2"]
# Metin → ses (Piper). DİKKAT: piper-tts 1.8 GPL-3.0-or-later lisanslıdır (docs/LISANSLAR.md)
tts = ["piper-tts>=1.8,<2"]
# OpenAI uyumlu sunucu (python -m ses sun)
sunucu = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18"]
# Geliştirme: denetim (scripts/check.py) için gereken her şey
dev = [
  "havuz-ses[stt,tts,sunucu]",
  "httpx>=0.28,<1",
  "ruff>=0.17,<1",
  "mypy>=2,<3",
  "pytest>=9,<10",
  "types-PyYAML>=6",
]

[project.scripts]
ses = "ses.cli:main"

[tool.setuptools.packages.find]
include = ["ses*"]

[tool.setuptools.package-data]
ses = ["py.typed", "web/*.html", "web/*.js", "web/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "modeller"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # içe aktarma sırası
  "UP",            # güncel sözdizimi
  "B",             # olası hatalar
  "SIM",           # sadeleştirme
  "C4",            # kapsamalar
  "RUF",           # ruff'ın kendi kuralları
  "S",             # güvenlik (bandit)
  "PLC2401", "PLC2403",  # ASCII olmayan ad yasak
  "ANN001", "ANN201", "ANN202",  # tip imzası zorunlu
]
ignore = [
  "E501",    # satır uzunluğunu biçimleyici yönetir
  "RUF001", "RUF002", "RUF003",  # Türkçe karakterler "belirsiz" sayılmasın
  "S101",    # assert: testlerde ve içsel değişmezlerde kullanılır
  "SIM108",  # üçlü ifade zorlaması okunurluğu düşürüyor
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "B011"]
"scripts/**" = ["S603", "S607"]
"ses/ses_isleme/ffmpeg.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_unreachable = true
files = ["ses", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "piper", "piper.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "model: indirilmiş gerçek model ister (SES_MODEL=1 ile açılır)",
  "ag: ağ ister (SES_AG=1 ile açılır)",
]
