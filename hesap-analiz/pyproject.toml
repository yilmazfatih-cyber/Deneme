[project]
name = "hesap-analiz"
version = "0.1.0"
description = "Banka ve kart ekstrelerini tamamen yerel analiz eden, ağa çıkmayan araç"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hesap-analiz = "hesap_analiz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hesap_analiz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
