# Kategori kuralları.
# Alanlar: kategori (zorunlu), anahtarlar (zorunlu), yon (gelen|giden, isteğe bağlı),
#          karsi_taraf (kurum varsayılan | belirsiz → kişi/kurum kararı ad tahminine kalır). Açıklama sadeleştirilir (büyük harf, Türkçe karakter atılır),
# sonra anahtar kelimeler sırayla aranır. İlk eşleşen kategori kazanır.
# Kendi marketini, kiracını vb. buraya eklemen yeterli.
