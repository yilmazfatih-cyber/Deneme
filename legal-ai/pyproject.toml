[project]
name = "legalai"
version = "0.1.0"
description = "Türkiye hukuk kaynakları (Resmî Gazete, mevzuat, yargı kararları) için toplama, depolama, RAG ve kaynak bağlantılı hukuki analiz"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.6",
  "pypdf>=4.0",
  "typer>=0.12",
  "rich>=13.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
]

[project.optional-dependencies]
voyage = ["voyageai>=0.3"]
local = ["sentence-transformers>=3.0", "torch"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
legalai = "legalai.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legalai*"]

[tool.setuptools.package-data]
legalai = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
