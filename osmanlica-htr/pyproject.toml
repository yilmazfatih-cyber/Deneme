[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osmanlica-htr"
version = "0.1.0"
description = "Osmanlıca (rik'a odaklı) küçük satır/kelime tanıma modeli ve A/B/C/D etiketleme döngüsü"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "pillow>=10", "scipy"]

[project.optional-dependencies]
disa = ["onnx", "onnxruntime"]
test = ["pytest"]

[project.scripts]
osm = "osmanlica_htr.cli:main"

[tool.setuptools.packages.find]
include = ["osmanlica_htr*"]
