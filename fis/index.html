<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100e0e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Fiş: masadaki hesabı herkes kendi telefonundan bölüşür. Hesap ve kurulum yok, sunucu yok; her şey bağlantıda."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Fiş</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f1ee;
        --card: #ffffff;
        --paper: #fffdf7;
        --text: #1d1b1a;
        --muted: #6a645f;
        --faint: #8e8781;
        --line: rgba(60, 50, 45, 0.14);
        --dash: rgba(60, 50, 45, 0.3);
        --fill: rgba(110, 100, 95, 0.12);
        --accent: #8e1b2a;
        --accent-press: #74131f;
        --accent-text: #8e1b2a;
        --accent-ink: #ffffff;
        --accent-soft: #f7e6e7;
        --ok: #1b7340;
        --ok-soft: #e0f2e6;
        --warn: #8f5200;
        --warn-soft: #fcefd2;
        --warn-bar: #d98a00;
        --bar: rgba(250, 248, 245, 0.94);
        --bar-solid: #faf8f5;
        --shadow: 0 1px 2px rgba(40, 20, 10, 0.05), 0 6px 18px rgba(40, 20, 10, 0.05);
        --radius: 14px;
        --tap: 44px;
        --side: 16px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #100e0e;
          --card: #1d1a1a;
          --paper: #221f1d;
          --text: #f4f0ec;
          --muted: #aaa29b;
          --faint: #857d77;
          --line: rgba(255, 240, 230, 0.13);
          --dash: rgba(255, 240, 230, 0.28);
          --fill: rgba(255, 240, 230, 0.1);
          --accent: #a82438;
          --accent-press: #8c1c2d;
          --accent-text: #ff8f9b;
          --accent-ink: #ffffff;
          --accent-soft: #3a1a1f;
          --ok: #6fd596;
          --ok-soft: #14301f;
          --warn: #f3bb55;
          --warn-soft: #382a0a;
          --warn-bar: #e6a12a;
          --bar: rgba(24, 21, 21, 0.94);
          --bar-solid: #181515;
          --shadow: 0 0 0 1px rgba(255, 240, 230, 0.05);
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 17px;
        line-height: 1.35;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        overflow-wrap: anywhere;
      }
      html.locked,
      html.locked body {
        overflow: hidden;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }
      a {
        color: var(--accent-text);
        touch-action: manipulation;
      }
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 3px solid var(--accent-text);
        outline-offset: 2px;
      }
      .num {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      svg.ic {
        flex: none;
        display: block;
      }

      /* ---------- İskelet ---------- */
      #app {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: calc(44px + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) calc(6px + env(safe-area-inset-right)) 0 calc(6px + env(safe-area-inset-left));
        background: var(--bar);
        -webkit-backdrop-filter: saturate(1.6) blur(18px);
        backdrop-filter: saturate(1.6) blur(18px);
      }
      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        min-height: var(--tap);
        min-width: var(--tap);
        padding: 0 10px 0 4px;
        border: 0;
        background: none;
        color: var(--accent-text);
        font-size: 17px;
        border-radius: 10px;
        text-decoration: none;
      }
      .nav-btn.icon {
        justify-content: center;
        padding: 0;
      }
      .nav-btn:active {
        opacity: 0.5;
      }
      .nav-brand {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 10px;
        min-height: var(--tap);
        font-weight: 600;
        font-size: 15px;
        color: var(--muted);
        text-decoration: none;
        border-radius: 10px;
      }
      .nav-brand svg {
        color: var(--accent-text);
      }
      main {
        padding: 2px calc(var(--side) + env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom))
          calc(var(--side) + env(safe-area-inset-left));
      }
      main.has-bar {
        padding-bottom: calc(132px + env(safe-area-inset-bottom));
      }
      h1.large {
        font-size: 32px;
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 4px 0 4px;
      }
      .lead {
        color: var(--muted);
        margin: 0 0 18px;
        font-size: 16px;
      }
      .meta {
        color: var(--muted);
        font-size: 15px;
        margin: 0 0 18px;
      }

      /* ---------- Gruplu liste ---------- */
      .label {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 26px 4px 8px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .label .count {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 500;
      }
      .foot {
        font-size: 13.5px;
        color: var(--muted);
        margin: 8px 4px 0;
      }
      .group {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 52px;
        padding: 9px 14px;
        border: 0;
        background: none;
        text-align: left;
        text-decoration: none;
        color: var(--text);
        position: relative;
      }
      .row + .row::before,
      .row + .detail::before,
      .detail + .row::before {
        content: '';
        position: absolute;
        top: 0;
        left: 14px;
        right: 0;
        border-top: 1px solid var(--line);
      }
      .row.inset-line + .row::before,
      .row.has-ic + .row.has-ic::before {
        left: 56px;
      }
      button.row:active,
      a.row:active {
        background: var(--fill);
      }
      .row .grow {
        flex: 1;
        min-width: 0;
      }
      .row .t {
        font-weight: 500;
      }
      .row .s {
        color: var(--muted);
        font-size: 14px;
        margin-top: 1px;
      }
      .row .amt {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        text-align: right;
      }
      .row .chev {
        color: var(--faint);
        transition: transform 0.18s ease;
      }
      .row[aria-expanded='true'] .chev {
        transform: rotate(90deg);
      }
      .row.action {
        color: var(--accent-text);
        font-weight: 500;
      }
      .row.action .s {
        font-weight: 400;
      }
      .tile {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        flex: none;
        background: var(--accent-soft);
        color: var(--accent-text);
      }
      .tile.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .tile.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .tile.plain {
        background: var(--fill);
        color: var(--muted);
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        background: var(--fill);
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
      }
      .avatar.ghost {
        background: none;
        border: 1.5px dashed var(--dash);
        color: var(--faint);
      }
      .avatar.me {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .detail {
        position: relative;
        padding: 6px 14px 12px 62px;
        font-size: 15px;
      }
      .detail .line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 0;
        color: var(--muted);
      }
      .detail .line span:last-child {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        color: var(--text);
      }
      .detail .tools {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        background: var(--fill);
        color: var(--muted);
      }
      .pill.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .pill.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      /* ---------- Düğmeler ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 50px;
        padding: 0 18px;
        border-radius: 14px;
        border: 0;
        background: var(--fill);
        color: var(--accent-text);
        font-weight: 600;
        font-size: 17px;
        text-decoration: none;
        text-align: center;
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:active {
        background: var(--accent-press);
      }
      .btn:active {
        opacity: 0.75;
      }
      /* İkincil ama etkin: renkli zemin + çerçeve (gri dolgu "kapalı" gibi okunuyordu). */
      .btn.tinted {
        background: var(--accent-soft);
        color: var(--accent-text);
        box-shadow: inset 0 0 0 1.5px var(--accent-text);
      }
      .btn.block {
        display: flex;
        width: 100%;
      }
      .btn.small {
        min-height: var(--tap);
        padding: 0 14px;
        font-size: 15px;
        border-radius: 11px;
      }
      .btn.quiet {
        background: none;
      }
      .btn:disabled {
        opacity: 0.45;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .link-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--tap);
        padding: 0 8px;
        border: 0;
        background: none;
        color: var(--accent-text);
        font-size: 15px;
        text-decoration: none;
        border-radius: 8px;
      }
      .link-btn.muted {
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .center {
        text-align: center;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 12px;
        margin-top: 22px;
      }

      /* ---------- Girdiler ---------- */
      .field {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 4px 14px;
        position: relative;
      }
      .field + .field::before {
        content: '';
        position: absolute;
        top: 0;
        left: 14px;
        right: 0;
        border-top: 1px solid var(--line);
      }
      .field > span {
        flex: none;
        font-weight: 500;
      }
      .field input,
      .field textarea {
        flex: 1;
        min-width: 0;
        width: 100%;
        min-height: var(--tap);
        border: 0;
        background: none;
        padding: 0;
        font-size: 17px;
        text-align: right;
        border-radius: 6px;
      }
      .field.col {
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        padding: 10px 14px;
      }
      .field.col > span {
        font-size: 13px;
        color: var(--muted);
      }
      .field.col input,
      .field.col textarea {
        text-align: left;
      }
      .field textarea {
        resize: none;
        min-height: 72px;
        padding: 4px 0;
        line-height: 1.35;
      }
      input::placeholder,
      textarea::placeholder {
        /* --faint gri dolgu üstünde 3:1'de kalıyordu; --muted her zeminde ≥ 4.5:1 */
        color: var(--muted);
        opacity: 1;
      }
      .field input:focus-visible,
      .field textarea:focus-visible,
      .li-edit input:focus-visible {
        outline: none;
      }
      .field:focus-within,
      .li-edit .box:focus-within {
        box-shadow: inset 0 0 0 2px var(--accent-text);
        border-radius: 10px;
      }
      .field.bad {
        box-shadow: inset 0 0 0 2px var(--warn-bar);
        border-radius: 10px;
      }
      textarea.big {
        display: block;
        width: 100%;
        min-height: 150px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
        padding: 12px;
        font-size: 16px;
        line-height: 1.35;
        resize: vertical;
      }
      .copy-box {
        display: block;
        width: 100%;
        min-height: var(--tap);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
        padding: 10px 12px;
        font-size: 16px;
      }
      .err {
        color: var(--warn);
        font-size: 14.5px;
        font-weight: 500;
        margin: 10px 4px 0;
      }
      .err:empty {
        display: none;
      }

      /* ---------- Fiş şeridi (yalnızca kalem listesi) ---------- */
      .receipt {
        --z: 7px;
        background: var(--paper);
        padding: calc(var(--z) + 6px) 0;
        filter: none;
        -webkit-mask:
          conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(2 * var(--z)) 51%
            repeat-x,
          conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / calc(2 * var(--z)) 51% repeat-x;
        mask:
          conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(2 * var(--z)) 51%
            repeat-x,
          conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / calc(2 * var(--z)) 51% repeat-x;
      }
      .receipt-wrap {
        filter: drop-shadow(0 1px 1px rgba(40, 20, 10, 0.08)) drop-shadow(0 6px 12px rgba(40, 20, 10, 0.06));
      }
      .li + .li,
      .li-edit + .li-edit,
      .receipt .sum {
        border-top: 1.5px dashed var(--dash);
      }
      .li-main {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        width: 100%;
        min-height: 56px;
        padding: 12px 14px;
        border: 0;
        background: none;
        text-align: left;
        color: var(--text);
      }
      button.li-main:active {
        background: var(--fill);
      }
      .li-main .grow {
        flex: 1;
        min-width: 0;
      }
      .li-main .t {
        font-weight: 500;
      }
      .li-main .s {
        color: var(--muted);
        font-size: 14px;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .li-main .amt {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        font-weight: 500;
        padding-top: 1px;
      }
      .li-main .amt small {
        display: block;
        text-align: right;
        margin-top: 2px;
      }
      .check {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid var(--dash);
        flex: none;
        display: grid;
        place-items: center;
        color: transparent;
        margin-top: 1px;
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .li.on .check {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .li.on .t {
        font-weight: 650;
      }
      .li-step {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 14px 12px 52px;
        font-size: 15px;
        color: var(--muted);
      }
      .stepper {
        display: inline-flex;
        align-items: center;
        background: var(--fill);
        border-radius: 12px;
        flex: none;
      }
      .stepper button {
        width: 48px;
        height: var(--tap);
        border: 0;
        background: none;
        display: grid;
        place-items: center;
        color: var(--accent-text);
        border-radius: 12px;
      }
      .stepper button:disabled {
        color: var(--faint);
        opacity: 0.5;
      }
      .stepper button:active:not(:disabled) {
        background: var(--fill);
      }
      .stepper output {
        min-width: 44px;
        text-align: center;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .receipt .sum {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px 6px;
        font-weight: 700;
      }
      .receipt .sum.sub {
        border-top: 0;
        padding: 0 14px 6px;
        font-weight: 400;
        color: var(--muted);
        font-size: 15px;
      }
      .receipt .sum.first {
        border-top: 1.5px dashed var(--dash);
        padding-top: 12px;
      }
      /* Fiş girişi satırı */
      .li-edit {
        padding: 10px 8px 10px 14px;
      }
      .li-edit .top {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .li-edit .box {
        background: var(--fill);
        border-radius: 10px;
        display: flex;
        align-items: center;
      }
      .li-edit input {
        width: 100%;
        min-width: 0;
        min-height: var(--tap);
        border: 0;
        background: none;
        padding: 0 10px;
        font-size: 16px;
        border-radius: 10px;
      }
      .li-edit .name {
        flex: 1;
        min-width: 0;
      }
      .li-edit .bottom {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding-right: 6px;
      }
      .li-edit .qty {
        width: 58px;
        flex: none;
      }
      .li-edit .qty input {
        text-align: center;
        padding: 0 4px;
      }
      .li-edit .unit {
        width: 112px;
        flex: none;
      }
      .li-edit .unit input {
        text-align: right;
      }
      .li-edit .x {
        color: var(--muted);
        flex: none;
      }
      .li-edit .tot {
        flex: 1;
        min-width: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        font-weight: 500;
      }
      .icon-btn {
        width: var(--tap);
        height: var(--tap);
        flex: none;
        border: 0;
        background: none;
        display: grid;
        place-items: center;
        color: var(--muted);
        border-radius: 10px;
      }
      .icon-btn:active {
        background: var(--fill);
      }

      /* ---------- Toplama: durum kartı ---------- */
      .hero {
        background: var(--card);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 16px;
      }
      .hero-top {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .ring {
        position: relative;
        width: 84px;
        height: 84px;
        flex: none;
      }
      .ring svg {
        display: block;
        transform: rotate(-90deg);
      }
      .ring .track {
        stroke: var(--fill);
      }
      .ring .arc {
        stroke: var(--warn-bar);
        transition: stroke-dashoffset 0.4s ease;
      }
      .hero.done .ring .arc {
        stroke: var(--ok);
      }
      .ring .mid {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        font-weight: 800;
        font-size: 21px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .ring .mid small {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0;
        margin-top: 3px;
      }
      .hero .k {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .hero .big {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        margin: 2px 0 4px;
        color: var(--warn);
        white-space: nowrap;
      }
      .hero.done .big {
        color: var(--ok);
      }
      .hero .side {
        min-width: 0;
        flex: 1;
      }
      .hero .sub {
        font-size: 14px;
        color: var(--muted);
      }
      .meter {
        height: 8px;
        border-radius: 99px;
        background: var(--fill);
        overflow: hidden;
        margin-top: 16px;
      }
      .meter i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: var(--warn-bar);
        transition: width 0.4s ease;
      }
      .hero.done .meter i {
        background: var(--ok);
      }
      .meter-cap {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13.5px;
        color: var(--muted);
        margin-top: 7px;
        font-variant-numeric: tabular-nums;
      }
      .said {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 11px 14px;
        position: relative;
      }
      .said + .said::before {
        content: '';
        position: absolute;
        top: 0;
        left: 56px;
        right: 0;
        border-top: 1px solid var(--line);
      }
      .said p {
        margin: 4px 0 0;
        flex: 1;
        min-width: 0;
      }
      .said p b {
        font-weight: 650;
      }

      /* ---------- Paylaş / QR ---------- */
      .qr-card {
        background: var(--card);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 10px 10px 16px;
        text-align: center;
      }
      /* Yoğun QR telefondan zor okunur: ekranın izin verdiği kadar büyük; sessiz bölge SVG'nin içinde (4 modül). */
      .qr {
        background: #fff;
        border-radius: 10px;
        padding: 0;
        width: min(100%, 440px);
        margin: 0 auto;
        aspect-ratio: 1;
      }
      .qr svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .qr-cap {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
      }
      .qr-none {
        color: var(--muted);
        font-size: 15px;
        padding: 18px 8px;
      }

      /* ---------- Yapışık alt çubuk ---------- */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 12;
        /* Opak: altından geçen liste düğmelerin içinden görünmesin (iOS'ta sabit + bulanıklık titremesi de olmaz). */
        background: var(--bar-solid);
        border-top: 1px solid var(--line);
        padding: 10px calc(var(--side) + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom))
          calc(var(--side) + env(safe-area-inset-left));
      }
      .bar-in {
        max-width: 528px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bar .grow {
        flex: 1;
        min-width: 0;
      }
      .bar .k {
        font-size: 13px;
        color: var(--muted);
      }
      .bar .v {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .bar .btn {
        flex: none;
        min-width: 124px;
      }
      .bar .btn.wide {
        flex: 1;
      }

      /* ---------- Yaprak ---------- */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0, 0, 0, 0.42);
        animation: fade 0.2s ease;
      }
      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: var(--kb, 0px);
        z-index: 31;
        max-width: 560px;
        margin: 0 auto;
        max-height: calc(100vh - 28px - env(safe-area-inset-top) - var(--kb, 0px));
        max-height: calc(100dvh - 28px - env(safe-area-inset-top) - var(--kb, 0px));
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.25);
        animation: rise 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .sheet-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 8px 6px calc(var(--side) + 4px);
        position: relative;
      }
      .sheet-head::before {
        content: '';
        position: absolute;
        top: 6px;
        left: 50%;
        width: 36px;
        height: 5px;
        margin-left: -18px;
        border-radius: 99px;
        background: var(--dash);
      }
      .sheet-head h2 {
        flex: 1;
        min-width: 0;
        margin: 6px 0 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sheet-body {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding: 6px calc(var(--side) + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom))
          calc(var(--side) + env(safe-area-inset-left));
      }
      .sheet-body > p {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 15.5px;
      }
      .sheet-body > p.foot {
        margin-top: 10px;
        font-size: 13.5px;
      }
      .sheet-body .label:first-child {
        margin-top: 8px;
      }
      .note {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 11px 12px;
        border-radius: 12px;
        background: var(--warn-soft);
        color: var(--warn);
        font-size: 14.5px;
        margin: 0 0 14px;
      }
      .note.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .note.plain {
        background: var(--fill);
        color: var(--muted);
      }
      .note span {
        flex: 1;
        min-width: 0;
      }

      /* ---------- Bildirim ---------- */
      .toasts {
        position: fixed;
        z-index: 50;
        /* Tek bildirim, altta: başlığı örtmez. Alt çubuk varsa hemen üstünde durur. */
        bottom: calc(14px + env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 12px;
        pointer-events: none;
      }
      html.with-bar .toasts {
        bottom: calc(84px + env(safe-area-inset-bottom));
      }
      /* Yaprak açıkken alt kısım düğmelerle dolu; bildirim karartılmış üst boşluğa çıkar. */
      html.locked .toasts {
        bottom: auto;
        top: calc(8px + env(safe-area-inset-top));
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 100%;
        padding: 11px 16px 11px 12px;
        border-radius: 14px;
        background: var(--text);
        color: var(--bg);
        font-size: 15px;
        font-weight: 500;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
        animation: drop 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .toast.out {
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      /* ---------- Ana ekran ---------- */
      .brand-mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        display: block;
        margin: 14px 0 14px;
        box-shadow: 0 6px 18px rgba(142, 27, 42, 0.28);
      }
      .steps {
        counter-reset: s;
      }
      .steps .row {
        align-items: flex-start;
        padding-top: 12px;
        padding-bottom: 12px;
      }
      .steps .n {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent-text);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 14px;
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .steps .row + .row::before {
        left: 54px;
      }
      .total-line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
      }
      .total-line .v {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .total-line .k {
        color: var(--muted);
        font-size: 15px;
      }
      .row.mine {
        background: var(--accent-soft);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        min-height: var(--tap);
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
      }
      .chip[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .hidden {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      noscript {
        display: block;
        padding: 24px;
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes rise {
        from {
          transform: translateY(100%);
        }
      }
      @keyframes drop {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
      }
      @media (max-width: 374px) {
        :root {
          --side: 12px;
        }
        h1.large {
          font-size: 29px;
        }
        .hero .big {
          font-size: 26px;
        }
        .ring {
          width: 76px;
          height: 76px;
        }
        .li-edit .unit {
          width: 100px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <noscript>Fiş'i kullanmak için JavaScript'i açın.</noscript>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
