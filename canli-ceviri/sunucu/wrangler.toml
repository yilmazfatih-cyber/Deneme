# Canlı Çeviri — geçici anahtar sunucusu (Cloudflare Workers, ücretsiz planda çalışır).
# Bu dosya herkese açık depodadır: içine gizli değer YAZILMAZ.
# Gizli değerler yalnız `wrangler secret put` ile girilir: SONIOX_API_KEY, OZET_TUZU (bkz. README).

name = "canli-ceviri-anahtar"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
# Uygulamanın paket kimliği ve abonelik ürünü; imzalı işlemde bunlar aranır.
PAKET_KIMLIGI = "com.yilmazfatih.canliceviri"
URUN_KIMLIGI = "canliceviri.haftalik"
# Abonelik DÖNEMİ başına kullanım bütçesi (saniye). Dönem, işlemin expiresDate değerine dek sürer; her yenilemede
# bütçe sıfırlanır. 9600 sn = 160 dakika: haftalık fiyat / 10 / saatlik Soniox maliyeti (4,99 $ / 10 / 0,18 $ ≈ 2,8
# saat, aşağı yuvarlandı). Fiyat ya da maliyet değişirse yeniden hesaplanır (bkz. README, "Sınırlar").
DONEM_SANIYE = "9600"
# Sandbox (TestFlight, App Review) işlemleri için ayrı, düşük bütçe. Sandbox'ta abonelik birkaç dakikada bir
# yenilendiği için dönem değil UTC GÜNÜ başınadır.
SANDBOX_GUNLUK_SANIYE = "1800"
# Tek anahtarın (dilimin) en uzun süresi (saniye). Verildiği anda tamamı bütçeden düşülür.
OTURUM_SANIYE = "120"
# "true" değilse Sandbox işlemleri reddedilir. TestFlight ve App Review Sandbox kullanır.
SANDBOX_IZINLI = "true"

[[durable_objects.bindings]]
name = "SAYAC"
class_name = "AbonelikSayaci"

[[durable_objects.bindings]]
name = "IP_SAYAC"
class_name = "IpSayaci"

# Ücretsiz planda Durable Object yalnız SQLite depolamalı sınıfla kurulabilir (new_sqlite_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AbonelikSayaci", "IpSayaci"]
