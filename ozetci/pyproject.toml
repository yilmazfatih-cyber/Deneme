[project]
name = "ozetci"
version = "0.1.0"
description = "1B altı açık modellerle PDF, e-posta ve görüntü okuyup özetleyen küçük Türkçe/İngilizce özetleyici"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pypdfium2>=4.30",
  "pillow>=10",
]

[project.optional-dependencies]
# Transformers tabanlı çalıştırma (LLM + OCR). CPU'da da çalışır.
hf = ["torch>=2.2", "transformers>=4.51", "accelerate>=0.30"]
# llama.cpp ile GGUF (CPU'da en hızlı yol)
gguf = ["llama-cpp-python>=0.3.0"]
# DocTags -> Markdown dönüşümü (SmolDocling / Granite-Docling çıktısı için)
ocr = ["docling-core>=2.0"]
# Hafif klasik OCR (PP-OCRv5 latin, ONNX Runtime; ~15 MB; modeller ilk kullanımda indirilir)
rapid = ["rapidocr>=3.0"]
# Aynı motor, modeller pakette gömülü (internetsiz kurulum) — yalnızca Çince+İngilizce tanıma
rapid-offline = ["rapidocr_onnxruntime>=1.3"]
# Klasik OCR yedeği (sistemde tesseract + tur dil paketi gerekir)
tesseract = ["pytesseract>=0.3.10"]
# İnce ayar (LoRA) ve veri hazırlama
train = ["torch>=2.2", "transformers>=4.51", "peft>=0.12", "trl>=0.19", "datasets>=2.19", "accelerate>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
ozetci = "ozetci.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ozetci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: ağır testler (torch/transformers gerekir)"]
