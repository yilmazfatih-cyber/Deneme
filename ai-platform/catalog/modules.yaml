# Modül kataloğu — mağazada görünen 30 modül (N00 ana model + 29 niş).
# Her modül: bileşenler (model + biçim + hedef), dışa açtığı işlemler (POST /api/modules/{id}/run/{action}),
# KVKK bildirimi, bağımlılıklar, ERP temas noktaları.
# `artifact` boş bırakıldığında kurulum sihirbazı donanıma göre seçer (GPU varsa vllm/bf16, yoksa llamacpp/q4).

- id: kvkk-kalkani
  niche_code: N12
  name: KVKK Kalkanı
  tagline: Kişisel verileri sunucuya gitmeden önce bilgisayarda maskeler.
  description: >
    TCKN (11 hane + sağlama algoritması), T.C. IBAN, telefon, VKN, plaka, e-posta için kural tabanlı
    tanıyıcılar; ad-soyad, adres, kurum gibi serbest metin varlıkları için GLiNER. Maskeleme sözlüğü
    yerelde tutulur, yanıt geri açılır (de-anonymization) ve her işlem denetim günlüğüne yazılır.
    Diğer tüm modüllerin önünde çalışır.
  package: KVKK Kalkanı
  roles: [Herkes]
  tier: T0
  status: stable
  components:
    - role: rules
      model: presidio
      artifact: default
      target: client
      shared: true
    - role: ner
      model: gliner-multi-pii-v1
      artifact: default
      target: client
      shared: true
  actions:
    - id: mask
      name: Maskele
      description: Metindeki kişisel verileri yer tutucularla değiştirir, eşleme anahtarı döner.
      input_schema: {type: object, required: [text], properties: {text: {type: string}, entities: {type: array, items: {type: string}}}}
      output_schema: {type: object, properties: {masked_text: {type: string}, mapping_id: {type: string}, findings: {type: array}}}
    - id: unmask
      name: Geri aç
      description: Maskeli yanıtı eşleme anahtarıyla orijinal değerlere döndürür.
      input_schema: {type: object, required: [text, mapping_id], properties: {text: {type: string}, mapping_id: {type: string}}}
      output_schema: {type: object, properties: {text: {type: string}}}
    - id: scan
      name: Tara
      description: Metinde hangi kişisel veri türlerinin geçtiğini raporlar (maskelemeden).
      input_schema: {type: object, required: [text], properties: {text: {type: string}}}
      output_schema: {type: object, properties: {findings: {type: array}}}
  kvkk:
    data_categories: [kimlik, iletişim, finans, lokasyon]
    special_categories: true
    masking_required: false
    purpose: Diğer modüllere giden verilerde kişisel verilerin asgariye indirilmesi
    retention_days: 365
  erp_touchpoints: []
  kpis: [Maskelenen kişisel veri sayısı, Yanlış negatif oranı (örneklem denetimi)]

- id: ana-model
  niche_code: N00
  name: Ana Model (GPU sunucu)
  tagline: Şirketin ortak büyük modeli; zor görevler, görsel anlama ve diğer modüllerin yedeği.
  description: >
    Qwen3.5-35B-A3B (3B aktif parametreli MoE, Apache-2.0, görsel girdi) sunucuda OpenAI uyumlu
    /v1 API olarak çalışır. GPU'suz sunucuda da CPU'da çalışabilir (yavaş). Tüm LLM tabanlı modüller
    uygun olduğunda bu modele yönlenir; sunucuya ulaşılamazsa bilgisayardaki küçük modele düşerler.
  package: Orkestrasyon
  roles: [BT]
  tier: T2
  status: stable
  components:
    - role: llm
      model: qwen3.5-35b-a3b
      target: server
      shared: true
    - role: guard
      model: granite-guardian-3.1-2b
      target: server
      shared: true
      optional: true
      note: Güvenlik Denetimi modülüyle paylaşılır
    - role: llm_alt
      model: gemma-4-26b-a4b
      target: server
      shared: true
      optional: true
      note: Türkçe akıcılık öncelikli şirketler için alternatif ana model
    - role: llm_small
      model: gpt-oss-20b
      target: server
      shared: true
      optional: true
      note: 16-24 GB GPU'lu sunucular için küçük ana model (Türkçe orta)
  actions:
    - id: chat
      name: Sohbet
      description: OpenAI uyumlu sohbet tamamlama (ayrıca /v1/chat/completions altında).
      input_schema: {type: object, required: [messages], properties: {messages: {type: array}, json_schema: {type: object}}}
      output_schema: {type: object, properties: {content: {type: string}, usage: {type: object}}}
    - id: health
      name: Sağlık
      description: Modelin yüklü ve yanıt verir olduğunu, bağlam uzunluğunu, bellek kullanımını döner.
  kvkk:
    data_categories: [serbest metin]
    special_categories: false
    masking_required: true
    purpose: Diğer modüllerin dil işleme ihtiyaçlarının karşılanması
    retention_days: 30
  depends_on: [kvkk-kalkani]
  erp_touchpoints: []
  kpis: [Ortalama yanıt süresi, Eş zamanlı kullanıcı]

- id: ocr-belge-okuma
  niche_code: N01
  name: OCR — Taranmış Belge Okuma
  tagline: Taranmış PDF ve fotoğrafı düzeniyle birlikte metne çevirir.
  description: >
    Taranmış sayfalar GPU sunucudaki PaddleOCR-VL ile düzen + metin + tablo olarak okunur. GPU yoksa
    bilgisayarda Tesseract (tur+eng) çalışır; kalite düşer, hız sayfa başına 1-3 sn kalır.
  package: Belge İşleme
  roles: [Muhasebe, Satın Alma, İK, Hukuk]
  tier: T1
  components:
    - role: ocr
      model: paddleocr-vl-1.6
      artifact: default
      target: server
      shared: true
    - role: ocr_fallback
      model: tesseract-tur
      artifact: system
      target: client
      shared: true
      optional: true
    - role: ocr_alt
      model: glm-ocr
      artifact: bf16
      target: server
      shared: true
      optional: true
      note: MIT lisanslı alternatif OCR (vLLM ile servis)
  actions:
    - id: read
      name: Oku
      description: PDF/görüntü dosyasını sayfa sayfa Markdown + blok listesine çevirir.
      input_schema: {type: object, required: [file], properties: {file: {type: string, format: binary}, pages: {type: string}}}
      output_schema: {type: object, properties: {pages: {type: array}, markdown: {type: string}, engine: {type: string}}}
  kvkk:
    data_categories: [belge içeriği (her tür)]
    special_categories: true
    masking_required: true
    purpose: Taranmış belgelerin aranabilir ve işlenebilir metne çevrilmesi
  depends_on: [kvkk-kalkani]
  erp_touchpoints: ["belge.arsiv (metin katmanı ekleme)"]
  kpis: [Sayfa başına süre, Karakter doğruluğu (örneklem)]

- id: pdf-ayristirma
  niche_code: N02
  name: PDF ve Ofis Belgesi Ayrıştırma
  tagline: Dijital PDF, Word, Excel ve sunumları yapılı Markdown/JSON'a çevirir; tabloları ayırır.
  description: >
    Docling ile düzen, okuma sırası ve tablo yapısı; pdfplumber ile hızlı metin katmanı. Taranmış
    sayfa tespit edilirse OCR modülüne devreder. Tamamen bilgisayarda çalışır.
  package: Belge İşleme
  roles: [Herkes]
  tier: T0
  status: stable
  components:
    - role: parser
      model: docling
      artifact: default
      target: client
    - role: layout
      model: granite-docling-258m
      artifact: default
      target: either
      optional: true
      note: Karmaşık düzen ve tablo yapısı için
  actions:
    - id: parse
      name: Ayrıştır
      description: Dosyayı Markdown, JSON blokları ve tablo listesine çevirir.
      input_schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      output_schema: {type: object, properties: {markdown: {type: string}, tables: {type: array}, is_scanned: {type: boolean}}}
  kvkk:
    data_categories: [belge içeriği]
    special_categories: false
    masking_required: false
    purpose: Belgelerin yerel olarak metne çevrilmesi (sunucuya veri gitmez)
  erp_touchpoints: ["belge.arsiv"]
  kpis: [Tablo yakalama oranı]

- id: ozetleme
  niche_code: N03
  name: Belge ve Rapor Özetleme
  tagline: Uzun belge, e-posta zinciri veya toplantı notunu maddeler ve eylemlerle özetler.
  description: >
    Parçala-özetle-birleştir yöntemiyle 200+ sayfaya kadar; çıktıda rakamlar kaynak sayfaya bağlanır.
    Kısa metinler bilgisayardaki Qwen3.5-4B ile, uzun belgeler ana modelle işlenir.
  package: Metin Asistanı
  roles: [Herkes]
  tier: T0
  components:
    - role: llm
      model: qwen3.5-4b
      target: either
      shared: true
  actions:
    - id: summarize
      name: Özetle
      description: Metni başlık, özet, maddeler, eylemler ve sayı doğrulama uyarılarıyla özetler.
      input_schema: {type: object, required: [text], properties: {text: {type: string}, style: {type: string, enum: [kisa, yonetici, madde, eylem]}, max_words: {type: integer}}}
      output_schema: {type: object, properties: {summary: {type: string}, bullets: {type: array}, actions: {type: array}, unverified_numbers: {type: array}}}
  kvkk:
    data_categories: [serbest metin]
    special_categories: false
    masking_required: true
    purpose: Çalışanların belge okuma yükünün azaltılması
  depends_on: [kvkk-kalkani]
  erp_touchpoints: ["belge.arsiv", "eposta.gelen"]
  kpis: [Okuma süresi tasarrufu]

- id: sozlesme-analizi
  niche_code: N04
  name: Sözleşme ve Uzun Belge Analizi
  tagline: Tarafları, süreleri, cezai şartları ve riskli maddeleri çıkarır; standart maddelerle kıyaslar.
  description: >
    Ana modelin uzun bağlamıyla (128K+) sözleşmeyi tek seferde okur; şirketin standart madde kütüphanesiyle
    farkları işaretler. Çıktı yapılandırılmış JSON ve insan okunur rapordur.
  package: Hukuk & Uyum
  roles: [Hukuk, Satın Alma, Yönetim]
  tier: T2
  components:
    - role: llm
      model: qwen3.5-35b-a3b
      target: server
      shared: true
    - role: parser
      model: docling
      artifact: default
      target: client
      shared: true
  actions:
    - id: analyze
      name: Analiz et
      description: Sözleşme metninden taraflar, tarihler, tutarlar, yükümlülükler, cezai şartlar ve risk notları.
      input_schema: {type: object, required: [text], properties: {text: {type: string}, checklist_id: {type: string}}}
      output_schema: {type: object, properties: {parties: {type: array}, dates: {type: array}, obligations: {type: array}, risks: {type: array}, report_md: {type: string}}}
    - id: compare
      name: Standartla kıyasla
      description: Maddeleri şirketin standart madde setiyle karşılaştırır, sapmaları listeler.
      input_schema: {type: object, required: [text, standard_id]}
  kvkk:
    data_categories: [kimlik, iletişim, finans, ticari sır]
    special_categories: false
    masking_required: true
    purpose: Sözleşme inceleme süresinin kısaltılması ve gözden kaçan maddelerin azaltılması
  depends_on: [kvkk-kalkani, ana-model, pdf-ayristirma]
  erp_touchpoints: ["sozlesme.kayit (öneri alanları)", "takvim.hatirlatma (yenileme tarihi)"]
  kpis: [İnceleme süresi, Yakalanan sapma sayısı]

- id: fatura-cikarim
  niche_code: N05
  name: Fatura / İrsaliye / Form → Yapılandırılmış Veri
  tagline: Belge görüntüsünden tedarikçi, tarih, kalemler, KDV ve toplamı JSON olarak çıkarır; toplamı doğrular.
  description: >
    OCR çıktısı + ana modelin görsel yeteneğiyle şema zorlamalı JSON üretir. Satır toplamları, KDV ve genel
    toplam kodla doğrulanır; uyuşmazlık varsa kayıt 'kontrol gerekli' olarak işaretlenir. ERP'ye yalnız
    öneri kayıt açılır, insan onaylar.
  package: Finans & Satın Alma
  roles: [Muhasebe, Satın Alma]
  tier: T1
  components:
    - role: ocr
      model: paddleocr-vl-1.6
      artifact: default
      target: server
      shared: true
    - role: llm
      model: qwen3.5-35b-a3b
      target: server
      shared: true
    - role: extractor
      model: nuextract-2.0-4b
      artifact: bf16
      target: server
      optional: true
      note: Çok yüksek hacimde ana modeli rahatlatan özel çıkarım modeli
  actions:
    - id: extract
      name: Alanları çıkar
      description: Fatura/irsaliye alanlarını şemaya göre çıkarır ve aritmetik doğrulama yapar.
      input_schema: {type: object, required: [file], properties: {file: {type: string, format: binary}, schema_id: {type: string, enum: [fatura, irsaliye, dekont, form]}}}
      output_schema: {type: object, properties: {fields: {type: object}, lines: {type: array}, validation: {type: object}, confidence: {type: number}}}
    - id: propose_entry
      name: ERP'ye öneri kayıt
      description: Çıkarılan veriyi ERP'de onay bekleyen kayıt olarak açar.
      human_approval: true
      input_schema: {type: object, required: [fields]}
  kvkk:
    data_categories: [kimlik, iletişim, finans, vergi]
    special_categories: false
    masking_required: true
    purpose: Fatura ve belge giriş sürecinin hızlandırılması
  depends_on: [kvkk-kalkani, ana-model, ocr-belge-okuma]
  erp_touchpoints: ["fatura.olustur (öneri, onay bekler)", "tedarikci.ara"]
  kpis: [Fatura giriş süresi, Alan doğruluğu, Geri dönen kayıt oranı]

- id: finans-hesap
  niche_code: N06
  name: Finansal Hesaplama Motoru
  tagline: Geri ödeme süresi, NBD, İVO, amortisman ve nakit akışı tabloları; hesap kodda, açıklama modelde.
  description: >
    Hesaplar numpy-financial ve platformun deterministik formül kütüphanesiyle yapılır; LLM yalnız doğal dil
    isteğinden parametreleri çıkarır (araç çağırma) ve sonucu Türkçe yorumlar. Modelin ürettiği hiçbir sayı
    rapora doğrudan girmez.
  package: Finans & Planlama
  roles: [Finans, Yönetim]
  tier: T0
  status: stable
  components:
    - role: engine
      model: finance-engine
      artifact: default
      target: client
    - role: llm
      model: qwen3.5-4b
      target: either
      shared: true
      optional: true
      note: Doğal dil → parametre ve Türkçe yorum için
  actions:
    - id: payback
      name: Geri ödeme süresi
      description: Basit ve iskontolu geri ödeme süresi.
      input_schema: {type: object, required: [investment, cash_flows], properties: {investment: {type: number}, cash_flows: {type: array, items: {type: number}}, rate: {type: number}}}
      output_schema: {type: object, properties: {simple_years: {type: number}, discounted_years: {type: number}, table: {type: array}}}
    - id: npv_irr
      name: NBD ve İVO
      description: Net bugünkü değer, iç verim oranı, kârlılık endeksi.
      input_schema: {type: object, required: [rate, cash_flows]}
    - id: amortization
      name: Kredi / amortisman tablosu
      description: Eşit taksit, anapara ve faiz ayrımıyla tablo.
      input_schema: {type: object, required: [principal, annual_rate, months]}
    - id: cashflow_projection
      name: Nakit akışı projeksiyonu
      description: Aylık gelir/gider varsayımlarından 12-60 aylık nakit tablosu.
      input_schema: {type: object, required: [months, opening_balance, inflows, outflows]}
    - id: ask
      name: Doğal dilde sor
      description: Türkçe soruyu uygun hesaba çevirir, hesaplar ve yorumlar (LLM gerektirir).
      input_schema: {type: object, required: [question]}
  kvkk:
    data_categories: [finansal veri (kişisel olmayan)]
    special_categories: false
    masking_required: false
    purpose: Yatırım ve nakit kararlarının hızlı, denetlenebilir hesaplanması
  erp_touchpoints: ["db.readonly (nakit, alacak, borç bakiyeleri)"]
  kpis: [Hesap hatası (sıfır hedef), Analiz hazırlama süresi]

- id: dogal-dil-sql
  niche_code: N07
  name: Doğal Dil → SQL (ERP Sorgulama)
  tagline: "'Geçen çeyrek en çok düşen 10 müşteri' gibi soruları salt-okunur SQL'e çevirir ve çalıştırır."
  description: >
    ERP veritabanı şeması (yalnız izin verilen tablolar) modele açıklanır; üretilen SQL sqlglot ile ayrıştırılır,
    yalnız SELECT'e izin verilir, LIMIT eklenir, zaman aşımıyla salt-okunur kullanıcıda çalışır. Sütun bağlama:
    sorgudaki her sütun şemaya bağlanır, olmayan sütun reddedilir ve model yakın adaylarla düzeltme turuna girer;
    birden çok aday istenirse aynı sonucu veren adaylar oylanır. Sonuç tablo + Türkçe açıklama olarak döner.
  package: Veri & Raporlama
  roles: [Finans, Satış, Yönetim]
  tier: T1
  components:
    - role: llm
      model: qwen2.5-coder-7b
      target: server
      shared: true
    - role: guard
      model: null
      target: either
      pip_extras: [text2sql]
      ram_gb: 0.1
      note: sqlglot ile SQL doğrulama
    - role: llm_alt
      model: arctic-text2sql-r1-7b
      artifact: bf16
      target: server
      shared: true
      optional: true
      note: Yalnız Text2SQL için eğitilmiş alternatif (GPU + vLLM); scripts/text2sql/merge_weights.py için görev vektörü kaynağı
  actions:
    - id: ask
      name: Soru sor
      description: Türkçe soruyu SQL'e çevirir, doğrular, çalıştırır ve sonucu açıklar.
      input_schema: {type: object, required: [question], properties: {question: {type: string}, connection_id: {type: string}, dry_run: {type: boolean}, evidence: {type: string, description: "ipucu / iş kuralı (ör. 'ödenmiş = durum odendi')"}, candidates: {type: integer, minimum: 1, maximum: 8}, max_repairs: {type: integer, minimum: 0, maximum: 4}, lang: {type: string, enum: [tr, en]}}}
      output_schema: {type: object, properties: {sql: {type: string}, rows: {type: array}, columns: {type: array}, explanation: {type: string}, tables: {type: array}, used_columns: {type: array}, attempts: {type: array}, selected_by: {type: string}}}
    - id: schema
      name: Şema özeti
      description: Bağlantıdaki izinli tabloların ve sütunların özetini döner.
  kvkk:
    data_categories: [müşteri, tedarikçi, finans]
    special_categories: false
    masking_required: true
    purpose: Raporlama taleplerinin BT'ye gitmeden yanıtlanması
  depends_on: [kvkk-kalkani]
  erp_touchpoints: ["db.readonly (salt okunur kullanıcı, tablo beyaz listesi)"]
  kpis: [Rapor talebi karşılama süresi, Doğru sorgu oranı, Şemaya bağlanamayan sorgu oranı (hedef %0)]

- id: kod-uretimi
  niche_code: N08
  name: Kod ve Betik Üretimi
  tagline: ERP eklenti kodu, rapor makrosu ve veri dönüşüm betiği üretir; sandbox'ta dener.
  description: >
    Qwen2.5-Coder-7B ile Python/SQL/JavaScript/C# üretimi; çalıştırma yalnız izole sandbox'ta (ağ kapalı,
    süre sınırlı). Üretilen kod ERP'ye insan onayı olmadan dağıtılmaz.
  package: Veri & Raporlama
  roles: [BT]
  tier: T1
  components:
    - role: llm
      model: qwen2.5-coder-7b
      target: server
      shared: true
  actions:
    - id: generate
      name: Kod üret
      description: Açıklamadan kod ve kısa test üretir.
      input_schema: {type: object, required: [spec], properties: {spec: {type: string}, language: {type: string}}}
    - id: run_sandbox
      name: Sandbox'ta çalıştır
      description: Üretilen Python kodunu ağ kapalı, 10 sn sınırlı alt süreçte çalıştırır.
      input_schema: {type: object, required: [code]}
  kvkk:
    data_categories: [yok (kod)]
    special_categories: false
    masking_required: true
    purpose: Geliştirme süresinin kısaltılması
  depends_on: [kvkk-kalkani]
  erp_touchpoints: ["eklenti.api (okuma)"]
  kpis: [Geliştirme süresi]

- id: semantik-arama
  niche_code: N09
  name: Semantik Arama (Gömme)
  tagline: Belgeleri anlamına göre indeksler ve arar; bilgi asistanının temeli.
  description: >
    Metin parçalanır, bge-m3 (sunucu) veya multilingual-e5-small (bilgisayar) ile vektöre çevrilir, yerel
    SQLite tabanlı vektör deposunda saklanır. Sorgu tarafı bilgisayarda çalışabilir.
  package: Bilgi Yönetimi
  roles: [Herkes]
  tier: T0
  status: stable
  components:
    - role: embedder
      model: bge-m3
      artifact: safetensors
      target: server
      shared: true
    - role: embedder_client
      model: multilingual-e5-small
      artifact: safetensors
      target: client
      shared: true
      optional: true
    - role: embedder_tr
      model: turkish-e5-large
      artifact: safetensors
      target: server
      shared: true
      optional: true
      note: Yalnız Türkçe külliyat için alternatif; bge-m3 ile kıyaslayın
  actions:
    - id: index
      name: İndeksle
      description: Belge koleksiyonunu parçalayıp vektör deposuna ekler.
      input_schema: {type: object, required: [collection, documents]}
    - id: search
      name: Ara
      description: Sorguya en yakın parçaları skorla döner.
      input_schema: {type: object, required: [collection, query], properties: {collection: {type: string}, query: {type: string}, top_k: {type: integer}}}
      output_schema: {type: object, properties: {hits: {type: array}}}
  kvkk:
    data_categories: [belge içeriği]
    special_categories: false
    masking_required: false
    purpose: Kurumsal belgelerde anlamsal arama (vektörler şirket içinde kalır)
  erp_touchpoints: ["belge.arsiv", "prosedur.kutuphane"]
  kpis: [İlk 5'te doğru belge oranı]

- id: yeniden-siralama
  niche_code: N10
  name: Yeniden Sıralama (Reranker)
