<!doctype html>
<!-- SENTETİK fixture: Koton, DeFacto ve Ipekyol listeleme kartlarının YAPISINI taklit eder; ürün adları,
     fiyatlar ve URL'ler uydurmadır, gerçek sayfa içeriği değildir. Her mağaza 2 kart. -->
<html lang="tr">
  <head><meta charset="utf-8" /><title>Sentetik listeleme</title></head>
  <body>
    <section id="koton">
      <div class="js-product-wrapper product-item" data-pk="1">
        <div class="product-item__body">
          <div class="product-item__badges-container"><img src="https://cdn.ornek.invalid/rozet.png" /></div>
          <div class="product-item__body-image">
            <a class="product-link js-product-link" href="/sentetik-keten-gomlek-1/"><picture><img src="https://img.ornek.invalid/k1_on.jpg" /></picture></a>
            <a class="product-link js-product-link" href="/sentetik-keten-gomlek-1/"><picture><img data-src="https://img.ornek.invalid/k1_arka.jpg" /></picture></a>
          </div>
        </div>
        <div class="product-item__info">
          <h2 class="product-item__info-name"><a class="js-product-link product-link" href="/sentetik-keten-gomlek-1/"> Sentetik Keten Gömlek </a></h2>
          <div class="product-item__info-price"><pz-price class="-actuel"> 1299.99 </pz-price></div>
          <div class="product-item__info-campaign"><span>3.000 TL ÜZERİNE %50</span></div>
        </div>
      </div>
      <div class="js-product-wrapper product-item" data-pk="2">
        <div class="product-item__body-image">
          <a class="product-link" href="/sentetik-saten-bluz-2/"><picture><img data-src="https://img.ornek.invalid/k2.jpg" /></picture></a>
        </div>
        <div class="product-item__info">
          <h2 class="product-item__info-name"><a class="product-link" href="/sentetik-saten-bluz-2/">Sentetik Saten Bluz</a></h2>
          <div class="product-item__info-price"><pz-price class="-actuel">599.99</pz-price></div>
        </div>
      </div>
    </section>
    <section id="defacto">
      <div class="product-card" data-index="1">
        <div class="product-card__image"><a class="product-card__multiple-image" href="/sentetik-basic-bluz-11">
          <div class="product-card__image--item"><img src="https://img.ornek.invalid/d11.jpg" /></div>
          <div class="product-card__image--item"><img class="swiper-lazy" src="https://img.ornek.invalid/hayalet.svg" data-src="https://img.ornek.invalid/d11_2.jpg" /></div>
        </a></div>
        <div class="product-card__title"><a class="product-card__title--name" href="/sentetik-basic-bluz-11"> <span>Sentetik Basic Bluz</span> </a></div>
        <div class="product-catalog-price-area">
          <div class="first-line"><div class="base-price campaing-base-price">766.99 TL</div></div>
          <div class="second-line"><div class="base-price lined-base-price">1299.99 TL</div></div>
        </div>
      </div>
      <div class="product-card" data-index="2">
        <div class="product-card__image"><a href="/sentetik-maxi-elbise-12">
          <div class="product-card__image--item"><img class="swiper-lazy" src="https://img.ornek.invalid/hayalet.svg" data-src="https://img.ornek.invalid/d12.jpg" /></div>
        </a></div>
        <div class="product-card__title"><a class="product-card__title--name" href="/sentetik-maxi-elbise-12"><span>Sentetik Maxi Elbise</span></a></div>
        <div class="product-catalog-price-area"><div class="first-line"><div class="base-price">1.799,99 TL</div></div></div>
      </div>
    </section>
    <section id="ipekyol">
      <ul class="grid">
        <li class="relative" data-productid="21">
          <figure><picture><img alt="Sentetik vatkalı bluz" src="https://img.ornek.invalid/mnresize/750/-/i21.jpg" /></picture></figure>
          <a class="absolute inset-0" href="/urun/sentetik-vatkali-bluz" title="Sentetik vatkalı bluz"></a>
          <div class="product-type-badges"><span>2 Ürüne %30</span></div>
          <span class="product-card-name">Sentetik vatkalı bluz</span>
          <div class="product-card-price-wrapper"><div class="sales-price">7.999,00 TL</div></div>
        </li>
        <li class="relative" data-productid="22">
          <figure><picture><img alt="Sentetik triko elbise" src="https://img.ornek.invalid/mnresize/750/-/i22.jpg" /></picture></figure>
          <a class="absolute inset-0" href="/urun/sentetik-triko-elbise"></a>
          <span class="product-card-name">Sentetik triko elbise</span>
          <div class="product-card-price-wrapper"><div class="sales-price">11.999,00 TL</div></div>
        </li>
      </ul>
    </section>
  </body>
</html>
